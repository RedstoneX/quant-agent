# Deliberately paused systemd units.
#
# `scripts/check_unit_drift.py` reads this file. A unit listed here that is
# installed-but-not-enabled is a deliberate pause, reported separately and
# NOT counted as drift. A listed unit that IS enabled means the box and this
# list disagree — that is reported as drift, on the theory that someone
# re-enabled it without updating the list. A listed unit that does not exist
# in this directory is an error in the list itself and is reported as one.
#
# An empty list is valid: it means the desk is fully running. Add an entry
# when a unit is paused; remove it in the same change that re-enables the
# unit (`systemctl --user enable --now <unit>`) — see the restart procedure
# in README.md.
#
# Each entry:
#   unit:   exact filename in scripts/systemd/
#   since:  date paused (YYYY-MM-DD)
#   reason: one line, why
#
# Sixteen timers were stopped together on 2026-10-01 (confirmed in the qamc
# user journal). Three later timers were installed disabled on 2026-10-06.
# All 19 are disabled now. The API service and status-board path are
# intentionally not paused.

paused_units:
  - unit: quant-agent-alert-heartbeat.timer
    since: "2026-10-01"
    reason: "Desk deliberately stopped; preserve the disabled timer on deploy."
  - unit: quant-agent-board-hygiene.timer
    since: "2026-10-01"
    reason: "Desk deliberately stopped; preserve the disabled timer on deploy."
