        note: "invariant 4, total-at-risk ceiling"
      - kind: symbol_in_file
        path: "src/pipeline.py"
        symbol: "def _risk_review_exits"
        note: "invariant 5, exits go through the same chain as entries"
      - kind: symbol_in_file
        path: "AGENTS.md"
        symbol: "only the **owner** may **accept** those changes"
        note: "invariant 8"
      - kind: manual
        note: "Invariant 2 (deterministic Python is final authority and fails closed) and invariant 7 (the system never blocks awaiting human approval) are properties of the whole pipeline's control flow, not any one symbol. No automated proof runs continuously. Confirm by reading src/pipeline.py's RiskStage and the absence of any wait-for-approval code path; this is the reason this phase's confidence is medium rather than high."

