      - kind: test_exists
        path: "tests/test_macro_feed_resilience.py"
        test: "test_backoff_and_deadline_bound_worst_case_wall_clock"
      - kind: symbol_in_file
        path: "src/models.py"
        symbol: "event_risk: str = Field(min_length=1)"
        note: "still-open gap: event_risk is a required narrative field the risk manager fills from its own reasoning — nothing here is fetched from a real economic/earnings calendar"
      - kind: manual
        note: "Still open: there is no macro event calendar. `grep -n event_risk config/prompts/risk_manager.md config/prompts/macro_analyst.md` shows the model is instructed to reason about upcoming Fed/earnings/macro events from its own knowledge; no module under src/data/ fetches a calendar of scheduled macro releases. Re-check by searching src/data/ for a FOMC/CPI/NFP release-date fetcher — if one exists, this item is closed."
