  - id: rehearsal_rig
    title: "Rehearsal rig — a full session, offline, in under a minute"
    plain_summary: "The trading desk can now be run through an entire session end to end with no live broker connection, no real market data feed, and no paid AI model calls — it replays a saved copy of a real production day instead. A full run takes well under a minute and costs nothing. It exists so a change to the trading logic can be exercised and checked before it is ever allowed near real positions or real spending, which matters because the market itself is only open a small fraction of the week and waiting for it to test something is not realistic. Its acceptance test specifically replays the afternoon of 2026-08-28, the day the desk stopped trading entirely after tripping a spending limit on only seventeen cents of actual cost, so that exact failure can be reproduced on demand and checked against going forward instead of being argued about from memory."
    status: "DONE AND LIVE"
    confidence: "high"
    evidence:
      - kind: file_exists
        path: "ops/rehearsal/run.py"
        note: "the rig's entry point"
      - kind: file_exists
        path: "ops/rehearsal/replay.py"
        note: "serves recorded model responses so a rehearsal makes no paid calls"
      - kind: file_exists
        path: "ops/rehearsal/broker.py"
        note: "the offline broker — a rehearsal cannot reach Alpaca"
      - kind: test_exists
        path: "tests/test_rehearsal_reproduces_cost_ceiling.py"
        test: "test_rehearsal_reproduces_2026_08_28_pm_cost_ceiling_failure"
      - kind: test_exists
        path: "tests/test_rehearsal_reproduces_cost_ceiling.py"
        test: "test_the_pre_fix_estimator_still_reproduces_the_2026_08_28_block"
      - kind: manual
        note: "Passing tests here prove the rig runs end to end and that it can still force-reproduce the 2026-08-28 cost-ceiling failure on demand — they do not prove the recorded model responses and market snapshot it replays against are still a faithful stand-in for a real trading day. That snapshot is fixed at the moment it was taken; as the strategy, the traded universe, and the market itself move on, a person needs to periodically judge whether it is still representative or needs refreshing, since no test can check that on its own. Re-check by looking at the snapshot's date and asking whether anything material has changed since."

  - id: open_defects
    title: "Known defects — found, recorded, not yet fixed"
    plain_summary: "Correction 2026-08-30: the two defects previously recorded here are both fixed — see the manual note below for the evidence trail. (1) A crashed intraday scan used to set scan_result=None with no error marker, indistinguishable from a healthy never-ran tick; PR #163 attaches an explicit crashed status that reports as a failure. (2) FRED's fetch used one bounded retry with a flat 2-second backoff and no wall-clock ceiling; PR #162 replaced it with config-driven retries, exponential backoff, and a real deadline — see the phase_4 entry for the full detail. Two different defects are recorded here in their place, found in the course of that same work and still genuinely open. (a) The desk has no macro EVENT CALENDAR: when the risk manager is asked whether a Fed decision or inflation print is coming in the next few days, it answers from the model's own memory, not from any fetched data — a real calendar was deliberately out of scope for PR #162, not authorised. (b) The OpenRouter price list the spending circuit depends on to safely estimate cost is a single point of failure: it only ever refreshes when a paid trading session actually starts, and nothing refreshes it on a schedule. Verified live 2026-08-30: the cache was last refreshed by a real session on 2026-08-28 (~13:30 UTC, per quant_agent.log's own cache-age readings), and by 2026-08-30 — a weekend, with no trading session running to notice — it had gone stale past the 48-hour point (24h fresh plus a 24h grace period) at which the circuit fails closed and hard-suspends every paid call for the rest of the day. No suspension event or operator reset is recorded in the live circuit log, and both pricing cache files carry a 2026-08-30 21:24 UTC timestamp, so someone refreshed it by hand before any session tried and failed. Had Monday's first session run before that manual refresh, the desk would have opened and traded nothing that day."
    status: "OPEN"
    confidence: "high"
    evidence:
      - kind: manual
        note: "Correction 2026-08-30: this entry previously named two defects that are now fixed. (1) A crashed intraday scan used to set scan_result=None with no error marker. PR #163 (commit 7b040f1e8d1a96bc5bf71ff504dc046dac992d0e) attaches an explicit 'intraday_scan_crashed' status on a crash, flowing through the same nested result[\"intraday_scan\"][\"status\"] shape the healthy statuses already use, present in ops/rehearsal/report.py's STATUS_PLAIN vocabulary, and deliberately excluded from _verdict's healthy set — see tests/test_intraday_scan_crash_visibility.py. (2) FRED's fetch used one bounded retry with a flat 2-second backoff and no wall-clock ceiling. PR #162 (commit 92689e6f3363ec8ed676f415cdb7337ec99644fd) replaced it with config-driven retries, exponential backoff with jitter, and a real total_fetch_deadline_s ceiling (90s default) that clips every timeout/backoff sleep and skips not-yet-attempted series once exhausted — see tests/test_macro_feed_resilience.py. Both PRs are merged AND deployed (production HEAD confirmed via `sudo -n -u qamc git -C /home/qamc/quant-agent log --oneline -1` at audit time). Re-verify with: `grep -n intraday_scan_crashed ops/rehearsal/report.py` and `grep -n total_fetch_deadline_s src/data/macro.py config/settings.yaml`."
      - kind: pr_merged
