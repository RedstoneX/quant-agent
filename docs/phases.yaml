  - id: rehearsal_rig
    title: "Rehearsal rig — a full session, offline, in under a minute"
    plain_summary: "The trading desk can now be run through an entire session end to end with no live broker connection, no real market data feed, and no paid AI model calls — it replays a saved copy of a real production day instead. A full run takes well under a minute and costs nothing. It exists so a change to the trading logic can be exercised and checked before it is ever allowed near real positions or real spending, which matters because the market itself is only open a small fraction of the week and waiting for it to test something is not realistic. Its acceptance test specifically replays the afternoon of 2026-08-28, the day the desk stopped trading entirely after tripping a spending limit on only seventeen cents of actual cost, so that exact failure can be reproduced on demand and checked against going forward instead of being argued about from memory."
    status: "DONE AND LIVE"
    confidence: "high"
    evidence:
      - kind: file_exists
        path: "ops/rehearsal/run.py"
        note: "the rig's entry point"
      - kind: file_exists
        path: "ops/rehearsal/replay.py"
        note: "serves recorded model responses so a rehearsal makes no paid calls"
      - kind: file_exists
        path: "ops/rehearsal/broker.py"
        note: "the offline broker — a rehearsal cannot reach Alpaca"
      - kind: test_exists
        path: "tests/test_rehearsal_reproduces_cost_ceiling.py"
        test: "test_rehearsal_reproduces_2026_08_28_pm_cost_ceiling_failure"
      - kind: test_exists
        path: "tests/test_rehearsal_reproduces_cost_ceiling.py"
        test: "test_the_pre_fix_estimator_still_reproduces_the_2026_08_28_block"
      - kind: manual
        note: "Passing tests here prove the rig runs end to end and that it can still force-reproduce the 2026-08-28 cost-ceiling failure on demand — they do not prove the recorded model responses and market snapshot it replays against are still a faithful stand-in for a real trading day. That snapshot is fixed at the moment it was taken; as the strategy, the traded universe, and the market itself move on, a person needs to periodically judge whether it is still representative or needs refreshing, since no test can check that on its own. Re-check by looking at the snapshot's date and asking whether anything material has changed since."

  - id: open_defects
    title: "Known defects — found, recorded, not yet fixed"
    plain_summary: "Two problems that turned up as a side effect of other engineering work and are not fixed yet. The standing rule here is that finding something broken while doing unrelated work is not a license to go fix it on the spot — it gets written down and handed back so a person can decide, which is what this entry is. None of these two belong to any of the numbered phases above; without this entry they would only exist in session notes and could quietly fall out of view. Each one below carries a plain command anyone can run to check whether it is still true. (A sixth item, 'company profiles were built and never wired in,' was removed on 2026-08-29 after verification against origin/main showed src/data/company.py's CompanyProfileStore is in fact imported and used by both src/notifier.py and src/pipeline.py — the claim was false when it was written to this file. Two more — the Missed Opportunities pop-up and the Diagnostics -> Search row-click affordance — were removed the same day after being fixed on branch fix/cockpit-click-consistency. A further one, the board rule that pinned the exact daily dollar ceiling, was removed the same day: that rule now asserts the setting exists rather than pinning its figure, so a deliberate re-tune no longer reads as rot.)"
    status: "OPEN"
    confidence: "high"
    evidence:
      - kind: manual
        note: "Win rate and average return cannot see a short trade. compute_trade_calibration in src/storage/db.py FIFO-matches BUY lots against sell-family exits; a covered short opens no BUY lot, so covering one closes nothing in this accounting and the trade stays invisible to win rate, average return and hold days — numbers that reach the Portfolio Manager as settled fact. Dormant only because shorts cannot be opened yet; becomes a live accounting hole the day they can. The function's own comments record the size of this kind of gap: omitting filled TRAIL_STOP exits once moved win_rate from 22.2% to 30.0% and avg_return from -2.79% to -2.18% on the real ledger. Re-check: `grep -n \"open_lots\" src/storage/db.py` and look for a short-side queue alongside it."
      - kind: manual
        note: "Correction 2026-08-29: this note previously said the write-ahead rows themselves cause the long-assuming fallback. Verified against origin/main and that mechanism is wrong, though the outcome it described is real. `_derive_close_side_for_drain` (src/pipeline.py:2211-2238) does NOT guess a side — it reads the broker's live signed position and returns 'sell'/'buy' when the position is readable, and returns None both when the broker read fails and when the position is already flat; its own docstring says the caller must NOT default to 'sell' in the unreadable case, because that is exactly the guess the design review forbids. The long-assuming fallback actually happens one level up, in `_drain_pending_protection_restores` (src/pipeline.py:2240): at line 2294 (sentinel-SELL branch) and line 2365 (terminal-SELL branch) it only passes `side=\"buy\"` when the helper returned exactly 'buy'; when the helper returns None it passes no side kwarg at all, so the two functions it calls, `_restore_after_unconfirmed_sell` (src/pipeline.py:1638) and `_finalize_protection_after_sell` (src/pipeline.py:2064), fall through to their own `side: str = \"sell\"` defaults. A comment at src/pipeline.py:2286-2292 confirms this is a deliberate, acknowledged tradeoff, not an oversight. The schema half of the original claim is correct as written: `pending_protection_restores` (src/storage/db.py:230-238, and the idempotent re-creation at :392-400) has columns id, symbol, sell_order_id, position_qty_before_sell, specs_json, created_at, run_id — no side column, and no ALTER TABLE anywhere in db.py adds one. Unreachable today because shorts cannot be opened; reachable, and wrong, the day they can. Re-check: `grep -n \"_drain_pending_protection_restores\\|_derive_close_side_for_drain\" src/pipeline.py` and `grep -n 'side: str = \"sell\"' src/pipeline.py`."

  - id: invariants
