    plain_summary: "Eight rules that are supposed to never be violated — paper trading only, every position always has a hard stop, no single trade can lose more than 5% of the account, deterministic safety code has the final say over any AI decision, and only the owner can change the rulebook. All are currently true in the running code; none has an automated proof that runs continuously."
