  - id: phase_6
    title: "Phase 6 — Cost circuit and transparency"
    plain_summary: "All three of the planned fixes are now built and confirmed live, though the first was fixed in two steps on two different days and the docs here did not catch up on the first step until now. §6.1 (spend capped in dollars, with an afternoon reserve): the operative per-mode limit has been a percentage of the daily dollar budget, not a session count, since PR #126 landed on 2026-08-28 — the session-count check that caused that day's outage was demoted to a backstop against an infinite retry loop only. As of PR #149 (2026-08-29) that backstop also counts only genuinely free-failed sessions (not every session that merely attempted a call) and cools off after a window instead of latching the whole mode for the rest of the ET day, and its setting was renamed to match what it now counts. An afternoon reserve walls off a slice of the daily budget from every mode until midday, so a quiet morning can't spend the afternoon's exit decisions out of budget. §6.2 (a dashboard that explains why a trade happened): every trade in a position's chain now carries a shared id linking a buy to the sell that closed it, a history endpoint reconstructs the full entry/interim/exit chain with realized P&L, exits carry a classified reason category, and the stored reasoning now renders in the trades table. The one sub-item not built is a deliberate owner reversal, not a gap: a position click charts the symbol in place rather than opening a modal. §6.3 (an accurate end-of-day P&L): the alert carries the true close-to-close figure and now also expresses it against risk capital, not just total equity. Separately, the four cost-circuit defects that caused the 2026-08-28 outage (an over-cautious spend estimate, a failed request billed as if it ran, an operator reset tool blocked by the fault it exists to clear, and the session-count cap) are all genuinely fixed now, not just stopgapped."
    status: "DONE AND LIVE"
    confidence: "high"
    evidence:
      - kind: setting_present
        path: "config/settings.yaml"
        key: "llm_cost_circuit.max_free_failure_sessions_per_mode"
        note: "Correction 2026-08-29: this rule's note previously said this setting being merely present proved §6.1 was NOT done because the cap was 'still session-based rather than dollar-based'. That was already false the day it was written — see the max_mode_daily_exposure_pct rule below, live since PR #126 (2026-08-28). What IS still true and worth asserting here: this setting is now explicitly a backstop-only guard against an infinite free-failure loop, not the operative limit, and PR #149 (2026-08-29, commits 254a664 + c523da4) fixed it to count only sessions that made a provider attempt and settled at zero cost, renamed it from max_paid_sessions_per_mode_per_day to describe that, and made it cool off after backstop_cooloff_minutes instead of latching the mode for the rest of the ET day."
      - kind: setting_present
        path: "config/settings.yaml"
        key: "llm_cost_circuit.daily_cost_limit_usd"
        note: "the key's PRESENCE, not its value, is the evidence: daily_cost_limit_usd is a deliberately-tuned value expected to be re-tuned as real trading experience accumulates, and pinning a specific number would make every legitimate re-tune read as false rot."
      - kind: setting_present
        path: "config/settings.yaml"
        key: "llm_cost_circuit.max_mode_daily_exposure_pct"
        note: "§6.1's actual operative per-mode limit: a fraction of the daily dollar budget, not a session count. Landed 2026-08-28 (commit b796dce, PR #126, 'fix(cost-circuit): dollar-based per-mode daily cap, plus an afternoon reserve') — this key's presence at all is what proves the dollar-based cap the spec asked for actually exists; its value is a tuned stopgap, deliberately not pinned here for the same reason as daily_cost_limit_usd above."
      - kind: setting_present
        path: "config/settings.yaml"
        key: "llm_cost_circuit.afternoon_reserve_pct"
        note: "§6.1's afternoon reserve: a fraction of the daily budget walled off from every mode until afternoon_reserve_release_et_hour. Same commit as above (b796dce, 2026-08-28); src/cost_circuit.py's _morning_spend_ceiling is where begin_call enforces it."
      - kind: manual
        note: "Correction 2026-08-29: this note previously claimed none of §6.2 (position_id linking a buy to its closing sell, GET /positions/{id}/history, reasoning rendered in the trades table) existed. That is no longer true: position_id now links every trade in a position's chain (a BUY from flat mints one; SELL/REDUCE/TRAIL_STOP/etc inherit it until flat — see `_assign_position_ids` in src/storage/db.py), a one-time `scripts/backfill_position_ids.py` fills it in for pre-existing history, `GET /positions/{position_id}/history` (src/api/routes_history.py) reconstructs the entry/interim/exit chain with realized P&L and hold duration, and `reasoning` is now a column in frontend/src/components/TradesPanel.tsx (truncated with a reveal-on-click, same idiom AgentPromptViewer.tsx uses). §6.2(e) (exit_reason_category) also landed — see the mechanical rules below. §6.2(d) is separately closed as WON'T DO, not done — see the next note. Re-check with the mechanical rules below rather than re-reading this prose."
