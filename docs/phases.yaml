# Purpose: let a script re-derive whether each recorded `status` is still
# true, without a human re-reading the spec or the docs (which have been
# confidently wrong before). Each phase carries `evidence`: a list of
# mechanically checkable rules. None of them require judgement — a script
# can evaluate every one of them and flag drift.
#
