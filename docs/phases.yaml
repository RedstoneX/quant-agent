  - id: phase_7
    title: "Phase 7 — Measurement"
    plain_summary: "Correction 2026-08-29: this phase previously said none of this had been started; that is now false. §7.1 (build a backtester) is done: a deterministic-layer backtester (src/backtest/) with a CLI (scripts/backtest.py) measures structural stop placement, noise-band widening, risk-based position sizing, the portfolio risk budget/cluster caps, and trailing-stop rules against real history, entering on the NEXT day's open (no look-ahead) and producing deterministic, reproducible results. Its own scope statement is explicit about what it is NOT: it does not replay the LLM agents' judgment at all — their historical outputs were never captured to replay, so it measures only the deterministic layer underneath them. §7.3 (surface the core edge numbers) is also done, on live trading history rather than backtest output: win rate, average win-to-average-loss ratio, expectancy per trade and average hold duration are all now computed (including, separately, the short side). Correction 2026-08-30: §7.2's logging half (pin each trade's allocated risk, conviction, and model at entry; label exit decision_id status) is now built (PR #159), but the analysis half (grading whether stated conviction predicts outcomes) cannot be done: only 8 closed round trips exist in live history, far too few for statistical claim. What is genuinely NOT built: the analysis half of §7.2 on both live history and backtest output."
