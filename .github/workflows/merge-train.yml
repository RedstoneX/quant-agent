name: merge-train

# Merges armed pull requests one at a time, each re-tested on the current
# main. See scripts/merge_train.py for why: with tests run once against a
# main that kept moving, every merge made every other open result obsolete.
on:
  push:
    branches: [main]
  pull_request_target:
    # Runs in main's context and never checks out the PR's code.
    types: [auto_merge_enabled]
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

# One conductor at a time; a second would send two changes to test at once.
concurrency:
  group: merge-train
  cancel-in-progress: false

permissions:
  contents: write       # update-branch merges main into the PR branch
  pull-requests: write
  actions: write        # dispatch the tests workflow on the updated branch

jobs:
  advance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Send the next armed change to test on current main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/merge_train.py --repo "$GITHUB_REPOSITORY"
