name: stale-ci

# A pull request whose head commit has no test run is invisible: the branch
# still shows the PREVIOUS commit's result, auto-merge never fires, and
# nothing notices. That happened to roughly six finished changes in one day.
# This job asks the only question that matters — does every open PR's head
# commit have a test run? — starts one where it is missing, and goes RED in
# the Actions tab when it found any. Red in Actions is the visible surface;
# it does not depend on a message being delivered, and desk alerts are muted.
on:
  schedule:
    # Every 30 minutes. The test suite itself runs in about two minutes, so a
    # stall is caught well inside the window in which somebody would still
    # have been waiting on the change.
    - cron: "*/30 * * * *"
  workflow_dispatch:

# Never let two sweeps overlap; a second one would dispatch duplicate runs
# for the same stale commits.
concurrency:
  group: stale-ci
  cancel-in-progress: false

permissions:
  contents: read
  actions: write        # needed to dispatch test.yml on a stalled branch
  pull-requests: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # No dependencies: the script shells out to the `gh` CLI, which is
      # preinstalled on the runner.
      - name: Sweep open PRs for a head commit with no test run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/check_stale_ci.py --repo "$GITHUB_REPOSITORY"
