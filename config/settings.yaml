# resident protective stop and the `trades` ledger never heard about it — no
# SELL row, `realized_pnl` stuck NULL on the BUY forever. See
# src/config.py::ReconciliationConfig and src/pipeline.py::
# _reconcile_stop_out_fills for the fix. This section is optional; omitting
# it keeps the documented default (7-day lookback) unchanged.
reconciliation:
  stop_out_lookback_days: 7   # how far back to ask the broker for a filled
                               # SELL the ledger doesn't already know about

# Tap-through link TelegramNotifier appends to session alerts so the
# operator can jump from a phone notification straight into Mission
# Control. Empty string disables the link — never emit a broken one.
# Defaults to the tailnet address Tailscale Serve exposes for the qamc
# API (ovh-vps.wallaby-bowfin.ts.net, proxying tailnet-only port 443 to
# the API on 127.0.0.1:8800), which mounts /cockpit (src/api/server.py).
# Tailscale-only — matches Mission Control's private, read-only posture.
notifications:
  mission_control_url: "https://ovh-vps.wallaby-bowfin.ts.net/cockpit/"

# Mandatory paid-analysis circuit.  It is persisted in the same SQLite DB and
# shared atomically across systemd processes.  Opening it suspends only model
# requests; broker-resident orders and deterministic safety work continue.
llm_cost_circuit:
  enabled: true
  require_telegram_alerts: true
  session_cost_limit_usd: 0.90
  daily_cost_limit_usd: 2.75
  # Item 14 (OWNER-APPROVED 2026-09-02, docs/WORK.md): the per-call cost
  # RESERVATION layer -- and every exposure ceiling / per-mode allowance /
  # afternoon reserve / free-failure-session backstop that existed only to
  # manage a reservation's over-holding -- is deleted. Real calls settled
  # at a median 0.38x of the pinned worst-case reservation rate, so that
  # machinery held ~2.6x what was ever spent and stopped the desk on money
  # that was never spent -- three times in one hour on 2026-09-02, against
  # ~$1/day of actual spend on this $2.75 ceiling. What replaces it:
  #   (a) a spend cap on the OpenRouter API key itself, outside this repo --
  #       see docs/WORK.md item 14(a). NOT configured here.
  #   (b) session_cost_limit_usd / daily_cost_limit_usd above, checked
  #       against REAL SETTLED cost only, no projection.
  #   (c) max_calls_per_session below -- a count-based runaway-loop
  #       backstop, independent of price.
  #
  # Set 2026-09-03 from real production data (llm_budget_sessions on the
  # live desk, tracked since 2026-08-26): the worst COMPLETE, successful
  # session ever recorded made 14 calls (a "morning" run; crashed/halted
  # sessions in the same table show FEWER calls, not more, since they got
  # cut off early). Almost all of that volume is tech_analyst chunking the
  # ~101-symbol universe, not the portfolio_manager, which makes exactly
  # one call every session without exception. 40 is ~3x that measured
  # ceiling -- owner-ratified as a first number, not a final one; see the
  # DECIDE BY line in docs/WORK.md to reconfirm after a few days live.
  max_calls_per_session: 40
  # max_provider_attempts_per_call is deliberately NOT pinned here. It must
  # cover what the agent retry loop can actually spend (primary attempts plus
  # the single cross-provider failover), and that budget lives in code, not
  # YAML -- see provider_attempt_budget() in src/agents/base.py. Pinning it
  # here at 2 against a worst case of 3 is what made failover impossible to
  # complete and darkened the desk on 2026-08-31. Config now derives it, and
  # AppConfig refuses to load an explicit value below the real worst case.
  # Pricing-staleness SPOF fix (2026-08-28): before this, an OpenRouter
  # catalog outage overlapping the first session past the cache's 24h
  # freshness boundary latched the whole desk via mark_unavailable(),
  # requiring an operator to run reset() by hand -- verified reproducible via
  # test_mandatory_openrouter_refresh_rejects_stale_cache_when_network_is_down.
  # 24h of grace ON TOP OF the 24h freshness window (48h total tolerance)
  # covers a full extra outage cycle before genuinely failing closed, which
  # is the point at which an unattended desk should stop and a human should
  # actually look at it. Independent of item 14: this bounds the pricing
  # CATALOG's own staleness for the estimated-cost fallback, not a deleted
  # per-call dollar reservation.
  openrouter_pricing_grace_period_hours: 24.0
  # Multiplier applied to a stale-but-in-grace rate at the far edge of that
  # grace window. See cost_table.openrouter_pricing_reservation_multiplier.
  openrouter_pricing_stale_multiplier_max: 1.50

evolution:
  # Quarterly meta-reflection can auto-append "Learnings" bullets to the six
  # non-discipline prompts (tech / news / macro / earnings / portfolio_manager
  # / evening_analyst); risk_manager + position_reviewer are protected
  # (MetaReflectionAgentName schema literal rejects them). Four belts enforce:
  # FIFO cap per agent, Jaccard dedup against existing Learnings, prohibited-
  # word regex, and git auto-commit (revert <hash> rolls back a whole quarter).
  #
  # EFFECTIVE MODE = enabled × dry_run (PromptEditor logs it loudly each run):
  #   enabled:false              -> OFF (observe only, nothing staged)
  #   enabled:true  dry_run:true -> STAGE-ONLY (proposals -> proposed_edits.json
  #                                 for human review; NO prompt files touched)
  #   enabled:true  dry_run:false-> LIVE-APPLY (writes prompt files + git commit)
  #
  # Current posture is STAGE-ONLY: the loop is a quarterly self-audit aid, not
  # an autonomous prompt-rewriter. The mechanical guardrails are all syntactic
  # (they can't tell a correct learning from a confidently-wrong one), so live
  # auto-apply is left OFF until a track record of staged proposals justifies
  # it — review proposed_edits.json by hand and apply with --mode meta --force
  # after flipping dry_run to false for that run.
  enabled: true
  dry_run: true            # explicit (was relying on the schema default)
  auto_commit: true
  max_agents_per_cycle: 3
  max_learnings_per_agent: 10
  max_learning_chars: 200
  min_justification_chars: 40
  jaccard_dedup_threshold: 0.6
  prohibited_words:
    - "never"
    - "always"
    - "override"
    - "ignore all"
    - "must always"
    - "must never"
  protected_agents:
    - "risk_manager"
    - "position_reviewer"
