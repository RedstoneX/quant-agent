  # tests/test_audit_fixes_2026_07_16.py against every advertised indicator.
  # 2026-08-27: raised 320 -> 1800 (~5 years) so structural levels are computed
  # over real history rather than a single year. src/data/levels.py finds
  # support/resistance deterministically in Python — 1,254 bars cost ~6ms and
  # zero LLM tokens — so more history is free here, unlike sending bars to a
