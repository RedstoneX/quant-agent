  # launchd-gated wrapper. The `intra_check` time here is meaningless in prod
  # (launchd fires it every 30-min tick across 09:30-16:00 ET; see wrapper).
  schedule:
    earnings_preprocess: "08:00"
    morning: "09:30"
    intra_check: "10:30"
    midday: "13:00"       # moved from 15:00 — afternoon lull, before EOD noise
    close: "15:30"        # new — 25min before close, triggers-only sell-only
    evening: "20:00"

storage:
  db_path: "data/quant_agent.db"

# 2026-08-28 ONDS/CCJ incident: both positions were closed by their broker-
# resident protective stop and the `trades` ledger never heard about it — no
# SELL row, `realized_pnl` stuck NULL on the BUY forever. See
# src/config.py::ReconciliationConfig and src/pipeline.py::
# _reconcile_stop_out_fills for the fix. This section is optional; omitting
# it keeps the documented default (7-day lookback) unchanged.
reconciliation:
  stop_out_lookback_days: 7   # how far back to ask the broker for a filled
                               # SELL the ledger doesn't already know about

# Tap-through link TelegramNotifier appends to session alerts so the
# operator can jump from a phone notification straight into Mission
# Control. Empty string disables the link — never emit a broken one.
# Defaults to the tailnet address Tailscale Serve exposes for the qamc
# API (ovh-vps.wallaby-bowfin.ts.net, proxying tailnet-only port 443 to
# the API on 127.0.0.1:8800), which mounts /cockpit (src/api/server.py).
# Tailscale-only — matches Mission Control's private, read-only posture.
notifications:
  mission_control_url: "https://ovh-vps.wallaby-bowfin.ts.net/cockpit/"

# Mandatory paid-analysis circuit.  It is persisted in the same SQLite DB and
# shared atomically across systemd processes.  Opening it suspends only model
# requests; broker-resident orders and deterministic safety work continue.
llm_cost_circuit:
  enabled: true
  require_telegram_alerts: true
  session_cost_limit_usd: 0.90
  daily_cost_limit_usd: 2.75
  # Reservations are sized from measured per-(agent, model) history when
  # there is enough of it (Defect 1, 2026-08-28; see
  # reservation_min_history_samples etc. below), falling back to a strict
  # UTF-8-byte token upper bound otherwise. These exposure ceilings permit
  # one normal large PM prompt under EITHER path while actual settled
  # spending remains governed by the lower limits above.
  session_reserved_exposure_limit_usd: 2.60
  daily_reserved_exposure_limit_usd: 5.50
  # Backstop only (Defect 4, 2026-08-28) -- NOT the operative per-mode
  # limit. Catches an infinite-loop session storm that the dollar check
  # below cannot, because a loop of provably-zero-cost failures (Defect 2)
  # spends nothing and so would never reach a dollar ceiling.
  #
  # It MUST sit far above legitimate operation, and twice it did not --
  # but both times the real defect was the COUNTING query, not the number.
  # At 2 it stopped intra_check on its 3rd session (measured 2026-08-25/26/
  # 27: 4, 7, 6 such stops/day against ~$1.02 of a $2.75 budget). Raised to
  # 8, still fired again at 20:00 UTC on 2026-08-28 benching intra_check on
  # its 9th session having spent $0.68 of $2.75, then raised again to 40 as
  # a stopgap. Every one of those sessions was successful and paid for
  # itself; the query counted them anyway (`logical_calls>0 OR
  # provider_attempts>0` -- true for any session that ever did anything,
  # not just a free-failure loop), so a normal trading day burned this
  # backstop down on its own no matter how high the number went.
  #
  # Defect 4.1 (2026-08-29): `LLMCostCircuitBreaker.begin_call` now counts
  # only sessions that made a provider attempt and settled at zero cost --
  # a session that spent money is the per-mode dollar allowance's problem,
  # not this guard's. Under that corrected count, 8 means "eight entirely
  # free, entirely failed sessions in one mode in one day", which is
  # unambiguous breakage on any real trading day; 40 was never a real
  # ceiling, it was the old counter's false-positive rate.
  max_free_failure_sessions_per_mode: 8
  # Defect 4.1 (2026-08-29): the backstop above now cools off instead of
  # latching the mode for the rest of the ET day -- a free-failure loop is
  # almost always a transient provider outage, and killing a mode until
  # rollover on a transient is exactly the 2026-08-28 failure. Minutes;
  # 5..720 (5 minutes .. 12 hours).
  backstop_cooloff_minutes: 60
  # Defect 4 operative limit: fraction of daily_reserved_exposure_limit_usd
  # any ONE mode may reserve/spend per ET day.
  max_mode_daily_exposure_pct: 60.0
  # Defect 4 afternoon reserve: fraction of daily_reserved_exposure_limit_usd
  # withheld from every session, in every mode, until the release hour below
  # -- close/evening/position_reviewer carry the exit decisions and must not
  # find the day's budget already spent by a busy or runaway morning.
  afternoon_reserve_pct: 40.0
  afternoon_reserve_release_et_hour: 12
  max_provider_attempts_per_call: 2
  max_retry_attempts_per_session: 2
  reservation_ttl_minutes: 30
  reservation_multiplier: 1.05
  # Defect 1 (2026-08-28): below this many (agent, model) rows in
  # agent_logs, reservation falls back to the byte=token / full-
  # max_output_tokens formula above rather than trusting a handful of
  # calls.
  reservation_min_history_samples: 20
  # Conservative LOW percentile of the measured bytes-per-token ratio (a
  # low ratio means MORE tokens per byte, i.e. higher cost). Deliberately
  # well below the median.
  reservation_conservative_percentile: 0.10
  # Safety margin over the maximum output_tokens observed for an agent+
  # model; still capped at that call's own max_output_tokens.
  reservation_output_margin: 1.20
  # Pricing-staleness SPOF fix (2026-08-28): before this, an OpenRouter
  # catalog outage overlapping the first session past the cache's 24h
  # freshness boundary latched the whole desk via mark_unavailable(),
  # requiring an operator to run reset() by hand -- verified reproducible via
  # test_mandatory_openrouter_refresh_rejects_stale_cache_when_network_is_down.
  # 24h of grace ON TOP OF the 24h freshness window (48h total tolerance)
  # covers a full extra outage cycle before genuinely failing closed, which
  # is the point at which an unattended desk should stop and a human should
  # actually look at it.
  openrouter_pricing_grace_period_hours: 24.0
  # Reservation multiplier at the far edge of that grace window -- 50% wider
  # than the in-hours 1.05 above, scaling up linearly from 1.05 (no
  # widening) the instant the cache turns stale. See
  # cost_table.openrouter_pricing_reservation_multiplier.
  openrouter_pricing_stale_multiplier_max: 1.50

evolution:
  # Quarterly meta-reflection can auto-append "Learnings" bullets to the six
  # non-discipline prompts (tech / news / macro / earnings / portfolio_manager
  # / evening_analyst); risk_manager + position_reviewer are protected
  # (MetaReflectionAgentName schema literal rejects them). Four belts enforce:
  # FIFO cap per agent, Jaccard dedup against existing Learnings, prohibited-
  # word regex, and git auto-commit (revert <hash> rolls back a whole quarter).
  #
  # EFFECTIVE MODE = enabled × dry_run (PromptEditor logs it loudly each run):
  #   enabled:false              -> OFF (observe only, nothing staged)
  #   enabled:true  dry_run:true -> STAGE-ONLY (proposals -> proposed_edits.json
  #                                 for human review; NO prompt files touched)
  #   enabled:true  dry_run:false-> LIVE-APPLY (writes prompt files + git commit)
  #
  # Current posture is STAGE-ONLY: the loop is a quarterly self-audit aid, not
  # an autonomous prompt-rewriter. The mechanical guardrails are all syntactic
  # (they can't tell a correct learning from a confidently-wrong one), so live
  # auto-apply is left OFF until a track record of staged proposals justifies
  # it — review proposed_edits.json by hand and apply with --mode meta --force
  # after flipping dry_run to false for that run.
  enabled: true
  dry_run: true            # explicit (was relying on the schema default)
  auto_commit: true
  max_agents_per_cycle: 3
  max_learnings_per_agent: 10
  max_learning_chars: 200
  min_justification_chars: 40
  jaccard_dedup_threshold: 0.6
  prohibited_words:
    - "never"
    - "always"
    - "override"
    - "ignore all"
    - "must always"
    - "must never"
  protected_agents:
    - "risk_manager"
    - "position_reviewer"
