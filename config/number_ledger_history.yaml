# The number-ledger ratchet, as an APPEND-ONLY record.
#
# WHY THIS FILE EXISTS. `MAX_ARBITRARY_ENTRIES` in src/number_sources.py used
# to be a hand-maintained literal carrying this entire narrative on ONE
# physical line, and its mirror in tests/test_number_sources.py had the same
# shape. Every branch that retired a number rewrote that one line, so any two
# such branches conflicted and the conflict was resolved by hand. The count is
# now COMPUTED from the deltas below and each change is its own entry, so two
# branches that each retire a different number touch different lines.
#
# HOW TO CHANGE THE COUNT. There is no count to edit. APPEND one entry at the
# END of this file carrying the `delta` your change makes to the number of
# `status: arbitrary` rows in config/number_ledger.yaml and a `why` that says
# what moved and on what grounds. `MAX_ARBITRARY_ENTRIES` is the sum of every
# `delta` here, and the build fails unless that sum equals the live count of
# arbitrary rows in the ledger -- so a row cannot leave the ledger without an
# entry here saying why, which is the same invariant the hand-edited literal
# enforced. Sourcing a number is a negative delta. Adding an unsourced
# trade-governing number is a positive one and is an owner decision
# (docs/OUTCOME.md), not a build fix.
#
# DO NOT EDIT AN EXISTING ENTRY. This file is registered `merge=union` in
# .gitattributes, so two branches that each append an entry merge with no
# conflict and both entries survive. That holds only while entries are
# APPENDED WHOLE at the end; rewriting an existing entry re-introduces exactly
# the conflict this file was written to remove.
#
# Every `why` and `detail` below is the previous narrative reproduced
# verbatim, re-wrapped for width and not otherwise altered: `why` is the text
# from the assertion message in tests/test_number_sources.py, `detail` the
# text from the comment block in src/number_sources.py. Two narratives ran in
# parallel, neither was complete on its own, and both are kept here.

