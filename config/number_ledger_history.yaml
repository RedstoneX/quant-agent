      `src.risk.rules.GROSS_LADDER_ALERT_PCT` moves `arbitrary` -> `sourced`,
      and its value moves -20 -> -10. The row's open question was "at what
      drawdown must the owner be told, independently of what the ladder does
      to exposure?", and a published standard answers exactly that: Article
      62(1) of Commission Delegated Regulation (EU) 2017/565, the MiFID Org
      Regulation, reproduced as COBS 16A.4.3UK, requires a portfolio manager
      to inform the client when the portfolio "depreciates by 10 % and
      thereafter at multiples of 10 %", by the end of that business day.
      Three differences are recorded in the ledger row rather than hidden:
      the rule measures from the reporting period's start and this desk
      measures peak-to-trough (always at least as deep, so the desk fires no
      later); the FCA revoked its UK copy from 23 October 2025 as a
      firm-burden measure, not as a finding that 10% is wrong, and the EU
      text stands, so it is cited as published practice and not as a binding
      rule; and the desk alerts every session past the threshold, which is
      louder than "multiples of 10%" demands. The change is strictly LOUDER
      -- the trigger is monotone and -10 is shallower than -20 -- which is
      the direction the 2026-09-30 revert of the deduplication draft
      insisted on. The six GROSS_LADDER rungs and multiples are untouched
      owner-ratified appetite; only the notification threshold moved, and it
      no longer coincides with the ladder's deepest rung.

