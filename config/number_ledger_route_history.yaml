      `src.config.RiskConfig.min_stop_atr_multiple` (2.5) is state 3. The
      recording that settles it was BUILT on 2026-09-30 by item 90's own
      `min_stop_atr_multiple` pass: the per-closed-trade excursion columns in
      `src/storage/db.py`. The value is untouched and is not re-derived here;
      only the route to its answer is now written where the check can see it.
  - delta: +1
    date: "2026-10-01"
    why: |
      The ALIGNMENT EXIT (owner ruling 2026-09-30, docs/WORK.md item 205)
      adds `src.risk.alignment_exit.ALIGNMENT_GIVE_BACK_ATR_MULTIPLE` (3.0)
      as an `arbitrary` row with NO settlement route, and this +1 records
      that honestly rather than hiding it. The row gains no `settles_by:`
      block because none of the three route kinds applies: it is not a
      structural bound, no recording in this desk accumulates it, and its
      own `open_question` states that no research can settle it -- how
      readily the desk blocks a sale is owner appetite, and the only thing
      that closes this row is the owner moving the dial. The published
      2.5-3.5 give-back band is context for the order of magnitude only;
      it is not a source, because Wilder and Le Beau measure give-back from
      a running extreme on ATR(22) while this measures it from a moving
      average on ATR(14). Lower this count by -1 the day a recording of
      realised give-back per alignment exit exists, or the day the owner
      ratifies the dial as a bound with his reason written down.
