      The six truncation caps record BOTH failed derivation attempts.
      First: derive each cap from the synthesis prompt's token budget --
      failed, because that budget is itself unledgered and every cap here
      is small enough relative to it that the budget constrains none of
      them. Second: derive each cap from the largest evidence the stream
      has actually carried -- failed, because nothing anywhere records a
      pre-truncation size, so there is no record to read. Stopped at two:
      the recording that would settle them IS the route.
