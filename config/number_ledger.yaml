# The number ledger -- where every trade-governing number came from.
#
# WHAT THIS FILE IS. The desk's standing rule (docs/OUTCOME.md, and the top of
# docs/WORK.md) is that a number which governs a trade must be read off the
# instrument, derived from something that is itself read off the instrument, or
# carry a written derivation at its definition site. Approval does not make a
# flat number non-arbitrary and neither does backtesting it into place. Until
# 2026-09-18 there was NO MECHANICAL CHECK of that rule at all.
#
# `src/number_sources.py` enumerates every numeric definition site inside a
# declared scope and requires each one to appear here. `tests/test_number_
# sources.py` fails the build otherwise, and `pytest` is the check branch
# protection requires. Read that module's docstring before editing this file:
# it states the scope rule, the six things this file is checked for, and --
# at the bottom -- what the check structurally cannot catch.
#
# WHAT THIS FILE IS NOT. It is not evidence that any number here is sourced.
# The gate tests that a justification EXISTS in a shape a reader can open; it
# cannot test that one is TRUE. Read that as a warning about this file rather
# than about the code, because it has already bitten: the entry for the 0.50%
# minimum risk floor was the most scrutinised line in the first version of
# this ledger, was headed "THE CASE THIS CHECK WAS BUILT FOR", and was FALSE
# IN FOUR PLACES --
#
#   * it said the number was absent from config/settings.yaml. It is at
#     config/settings.yaml:751, and that is the LIVE value.
#   * it said the number was absent from every document. It is the
#     owner-ratified risk-envelope row at docs/OUTCOME.md:84.
#   * it said the number was absent from any ratification record. It was
#     ratified 2026-08-27, commit 75c02335.
#   * it said the number existed in exactly one place, while this same file
#     listed it twice -- and a third site (src/config.py:770) was invisible to
#     the scanner because its default was bound to a NAME.
#
# It also cited a comment at src/portfolio_constructor.py:480-488 as calling
# that 0.50% "a constructor default nobody chose". That comment is about
# `risk_budget_pct`'s prior value, a legacy NOTIONAL target -- a different
# quantity that shares a digit. Every one of those five claims was one grep
# from being disproved and none was checked.
#
# So: if you are about to cite this file as authority for a number, open the
# citation. That is why `source` must now be a URL or a `path:line` and not
# prose. Seven entries carrying corrected claims are marked CORRECTION
# 2026-09-18 in their notes rather than quietly rewritten.
#
# HOW TO ADD A NUMBER. `arbitrary` is NOT the easy field. Say where the
# number came from:
#
#   instrument  -- read off the instrument at run time, or fixed by an external
#                  spec the desk does not choose (a broker tick size, an
#                  exchange margin requirement, a statutory deadline).
#                  Requires a `source` a non-author can open.
#   sourced     -- a cited derivation or published source, written down.
#                  Requires a `source` a non-author can open: a URL, or a
#                  repo `path:line`. A source for a RANGE is not a source for
#                  a point value inside it.
#   derived     -- computed from, or a second definition site of, another
#                  entry in this file. Requires `derived_from` (its id) and
#                  `base_value` (what the base held when the derivation was
#                  written). If the base later moves, the build FAILS. This
#                  is also how a MIRRORED number is recorded -- one number
#                  with two definition sites is one number, not two, which is
#                  what makes the arbitrary count a count of NUMBERS rather
#                  than of rows.
#   arbitrary   -- live, governs trades, nothing behind it. A DEBT, not a
#                  status. Requires all three of `note`, `open_question` (the
#                  question in a form somebody could actually answer -- a
#                  measurement to take or a ruling to make, not "is this
#                  right?") and `cost_while_unanswered` (what the desk pays
#                  meanwhile). RATCHETED: the count must EQUAL
#                  `MAX_ARBITRARY_ENTRIES` in src/number_sources.py, so
#                  sourcing one means lowering that number in the same commit
#                  and a row cannot leave this file silently.
#   not-trade-governing -- in scope structurally, cannot reach a trade
#                  decision. Requires `note` saying why.
#
# `value` must equal the live literal AND, where the field is reachable from
# config/settings.yaml, the DEPLOYED value there. That second half matters:
# this file records the CODE DEFAULT, and for 52 of these sites the number the
# desk actually trades comes from the YAML.
#
# SEEDED 2026-09-18 from board item 90, reworked the same day after review.
# NO VALUE WAS CHANGED -- changing a live trade-governing number is the
# owner's call and several are ratified-but-unsourced.
numbers:
  - id: src.config.CashSweepConfig.min_order_usd
    value: 500
    status: arbitrary
    site: src/config.py
    note: >-
      Minimum order value. Not a broker minimum -- the broker accepts
      fractional notional well below it. A round $500 with nothing behind it,
      and it compounds with min_risk_pct to drop small plans.
    open_question: >-
      What is the smallest sweep order whose expected slippage and commission
      are a tolerable fraction of the interest it earns, on this account's
      actual cash balances?
    cost_while_unanswered: >-
      Cash under $500 is never swept and earns nothing; compounded with the
      0.50% risk floor it also silently drops small trade plans.
  - id: src.config.CashSweepConfig.reserve_pct
    value: 1
    status: arbitrary
    site: src/config.py
    note: >-
      % of equity kept as raw cash for fees, slippage and partial fills;
      everything above it is parked in the T-bill ETF (src/config.py:1175).
      src/config.py:1178 records that an earlier pass raised it to 5.0 as a
      workaround for BUYs being skipped and it was deliberately put back.
    open_question: >-
      What is the largest observed shortfall between an order's sized cost and
      its settled cost on this account - fees, slippage and partial fills
      together?
    cost_while_unanswered: >-
      Too low and a funded order fails for want of cash; too high and equity
      sits in raw cash earning nothing.
