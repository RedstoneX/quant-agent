  - id: src.prompt_facts.review.blocked.ReviewBlocked._build_blocked_proposals(lookback_days)
    value: 21
    status: arbitrary
    site: src/prompt_facts/review/blocked.py
    note: >-
      Window of the PM's 'names you keep proposing and never get' memory
      (src/prompt_facts/review/blocked.py::ReviewBlocked._build_blocked_proposals). Its only caller (src/stage_decision.py::DecisionStage.run) passes nothing, so this
      default is live. Same class as the smart-money prompt-truncation caps
      classified arbitrary on 2026-09-19: it decides what evidence a trading
      seat's verdict is built from. ITEM 90 TRANCHE 2 (PIPELINE), 2026-10-01 -- ROUTED, and both failed derivation attempts are written down so nobody repeats them. (1) Derive the window from the desk's ratified SWING mandate (days to weeks, docs/OUTCOME.md@`**Horizon:** swing — days to weeks.`): FAILED -- the mandate deliberately names no number and holds hold-length to be an output, not a setting, so it cannot fix a lookback. (2) Derive it from another ledgered window row: FAILED -- every sibling evidence window in this ledger is itself `arbitrary`, so the arithmetic would only relabel one unsourced number as another's child. Two attempts is the limit, exactly as the smart-money truncation caps found on 2026-09-19, and the same reason applies: nothing records how much evidence existed BEFORE the cut, so the RECORDING is the route. The value is unchanged by this pass.
    open_question: >-
      How much history does this memory need before its signal is
      distinguishable from noise, and how much before older rows stop changing
      the seat's decision -- measured on the recorded decision rows?
    cost_while_unanswered: >-
      The seat's feedback memory is cut at a round number: too short and it
      cannot see a repeating pattern, too long and stale rows steer today's
      decision.
    settles_by:
      kind: "recording"
      state: "specified"
      where: "docs/board_notes/item-090.md (item 90, the 2026-10-01 pipeline tranche)"
      records: >-
        every build of this prompt block, with the count of candidate rows available BEFORE this cut, the count that
        survived it, the age of the oldest surviving row and the seat's verdict, so the bite of the cut is a recorded
        series instead of an assumption nobody can inspect
      closes_when: >-
        a run of sessions shows the surviving-row count beyond which the seat's verdict stops changing; the window or
        cap is then set at that point, read off the recording, instead of at a round number. Never set from which
        window would have traded best
