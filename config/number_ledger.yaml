    open_question: >-
      Same question at the 5-session window. src/config.py:576 says the 3 is
      INHERITED, not re-derived, with no measured drawdown record to validate
      it against.
    cost_while_unanswered: >-
      This is the ANCHOR the one-day multiple is derived from, so its error
      propagates into the daily brake.
