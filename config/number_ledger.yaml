  - id: src.config.RiskConfig.maintenance_margin_pct
    value: 25
    status: instrument
    site: src/config.py
    source: >-
      FINRA Rule 4210(c)(1): the margin which must be maintained is 25 percent
      of the current market value of margin securities held long.
      https://www.finra.org/rules-guidance/rulebooks/finra-rules/4210 (fetched
      and confirmed 2026-09-18). Quoted at the definition site
      src/config.py:952. Not a desk choice, and used only to report
      distance-to-forced-liquidation. CAVEAT recorded rather than asserted
      away: 25% is the REGULATORY FLOOR and brokers routinely enforce 30-40%,
      so a distance-to-liquidation computed from it is the most optimistic
      case, not the broker's.
