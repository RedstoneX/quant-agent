  - id: src.risk.trailing.NOISE_BAND_ATR_MULTIPLE
    settles_by:
      kind: measurement
      state: specified
      where: docs/board_notes/item-090.md (item 90, the 2026-10-01 tranche-five pass over src/risk)
      records: >-
        across the tradable universe, how far price routinely retraces against a live trend in the
        name's own ATR without the trend ending, so the distance a new stop must keep from price is
        read off universe price behaviour and not off this desk's fills -- and, in the same pass,
        whether this 1.25 and the exit guard's 1.0 of the same name are one quantity or two
      closes_when: >-
