  - id: src.config.ExecutionConfig.max_entry_slippage_bps
    settles_by:
      kind: measurement
      state: specified
      where: docs/board_notes/item-090.md (the 2026-10-01 eighth routing tranche)
      records: the distribution of quoted half-spread in basis points across the universe the desk
        could trade, on public daily bars, sampled at the time of day the desk actually sends entries,
        so the admission ceiling is a point on a measured spread distribution rather than a round
        forty basis points. RECORDER BUILT 2026-10-04 in src/entry_slippage_bound.py, because the production
        DB held no record of this check ever binding, so the count of entries it has priced away was
        unknown and no re-derivation was possible; every BUY and SHORT entry check now writes an
        `entry_slippage_check` evidence row with the observed slippage, the cap, whether the cap
        bound, and that name's own latest daily range as a percent of close, behaviour unchanged, and
        the value stays `arbitrary` until those rows exist in number
      closes_when: the half-spread distribution is in hand and the ceiling is set at a stated percentile
        with the share of the universe it excludes named; it is DELETED, and the spread is charged
        to sizing instead of gating admission, if the measured distribution has no tail the ceiling
        separates
    value: 40
    status: arbitrary
    site: src/config/__init__.py
    note: >-
      The entry-slippage belt: executed geometry worse than this rejects the
      fill. docs/INCIDENT_HISTORY.md records the belt comparing every range
      ticket to a flat unsourced number and skipping a name the constructor
      had already approved. 40bps is not read off any spread.
      MEASURED 2026-09-26 from this desk's own filled orders (board item 183;
      method and the full distribution are in docs/INCIDENT_HISTORY.md).
      Source rows: the production `trades` table, `fill_status = 'filled'`,
      2026-09-15 to 2026-09-25 -- 30 BUY and 3 SHORT entries. The reference
      price is recovered from the stored submitted limit, which this belt
      itself sets at reference x (1 +/- 40bp), so realised entry slippage is
      (fill - reference)/reference.
      Result: median +2.6bp, 90th percentile +26.4bp, maximum exactly +40.0bp
      -- one order of the 30 filled AT the belt and none above it. The belt is
      therefore not routinely binding, and it does not explain any ordinary
      fill. It also does NOT identify 40: the sample is RIGHT-CENSORED by the
      belt itself (an order that would have slipped past 40bp is refused, so
      it can never appear), and the refusals sit far away -- every one of the
      9 recorded slippage skips had the quoted ask 391bp to 1466bp above the
      reference. Between roughly 32bp and 390bp no observed order distinguishes
      one value from another. Measured, and still unsourced at 40.
      2026-09-30 (board item 183): this belt is now the ONLY thing bounding
      what an entry pays. The far-through-quote skip that used to sit on top
      of it was deleted after all 8 of its recorded firings measured as venue
      noise rather than a market that had run, so an order whose displayed
      quote sits past the ceiling is now sent at the ceiling instead of
      refused. Nothing about the belt's own value changed, and the deletion
      does not make 40 any more identified -- but it does start producing the
      observation the censoring problem below was blocked on: an entry that
      rests unfilled at the ceiling is now a recorded outcome rather than a
      refusal, so the rate at which 40bp is too tight to fill becomes
      measurable from the desk's own orders for the first time.
      RATIFIED 2026-09-30 as owner appetite, board item 183, the last of
      that item's five order-placement gates: the 2026-09-26 measurement
      leaves a band of roughly 32bp to 390bp inside which the desk's own
      filled and refused orders decide every observed case identically,
      so nothing in the data or in published practice picks a figure and
      40 is a choice, not a derivation. It is recorded as a dial rather
      than changed, because inventing a replacement inside an
      indifference band would be the same arbitrary act with a newer
      date. Two successor routes stay open and are written into the
      board item rather than lost here: reading the ceiling off each
      name's own Corwin & Schultz half-spread once the reference-to-
      submission drift term has its own instrument-read basis, and re-
      measuring the untruncated fill rate now that the deleted 2% ask-
      skip lets a too-tight entry rest and be recorded instead of being
      pre-refused.
    open_question: >-
      The distribution is now measured and it does not pick a percentile,
      because the belt censors its own tail. Answering this needs data the
      desk does not have: either the untruncated slippage of orders it
      currently refuses, which would mean deliberately sending some through a
      wider belt, or a published reference for an acceptable entry-slippage
      bound on retail marketable limits. Until one of those exists, 40 is a
      choice inside a measured indifference band of roughly 32bp to 390bp, and
      choosing inside it is the owner's appetite rather than a measurement.
    cost_while_unanswered: >-
      An approved trade is silently not sent when the book is merely busy, or
      a genuinely abnormal book is paid through.
    owner_appetite_2026_10_02: >-
      THIS IS AN OWNER APPETITE QUESTION, NOT A MEASUREMENT GAP, and it is
      recorded as one here because the distinction was not drawn on the row.
      The slippage distribution under the belt IS already measured; what no
      measurement can produce is the tail, because the belt refuses the orders
      that would populate it, so the data needed to pick a percentile can only
      be bought by deliberately sending some refused orders through a wider
      belt and paying whatever they fill at. The one sentence the owner would
      be answering: are you willing to pay worse fills on a small number of
      deliberately admitted orders in order to learn what the entry belt is
      currently refusing, and if so for how many orders. No value is proposed
      and none may be picked until that is answered; the row stays `arbitrary`
      and its recording route is unchanged.
