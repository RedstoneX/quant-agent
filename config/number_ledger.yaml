    site: src/data/smart_money_cluster.py
    note: >-
      Board item 124, corrected defect axis (2026-09-20): the previously
      proposed fix (adjusting the shared row-level sort key in
      `SECForm4Provider.fetch`) was found unsafe on review -- wrong
      signal-weight values, a nonexistent flag, and it would have overridden
      dollar-value ordering entirely rather than narrowly tie-breaking. The
      fix actually shipped instead reserves a small, bounded number of
      `max_observations` slots so a genuinely clustered symbol cannot be
      crowded out entirely by unrelated higher-dollar buys on OTHER symbols
      (`reserve_cluster_symbols`). 5 is an undderived round number picked
      only to keep the reservation small relative to `max_observations`
      (=40): nothing measures how many genuine same-day clusters occur on a
      typical day, so this cap could as easily starve a legitimately busy
      cluster day as protect a quiet one.
    open_question: >-
