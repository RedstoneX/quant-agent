  - id: src.config.RiskConfig.min_level_touches_for_stop_honor
    value: 5
    status: arbitrary
    site: src/config.py
    note: >-
      How many touches make a price level real enough to honour a tight stop
      against. Osler (2000) established the bounce-frequency TEST but
      evaluates levels published by dealing firms and never defines a touch
      count -- searched and ruled out, docs/INCIDENT_HISTORY.md. Unsourced.
    open_question: >-
      The 5 comes from a measured real-vs-shuffled separation table
