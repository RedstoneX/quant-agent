    open_question: >-
      Same question at the run level: how many nominations can one session
      resolve end to end?
    cost_while_unanswered: >-
      As above, plus the cap interacts with the per-seat cap in a way nothing
      measures.
  - id: src.config.RiskConfig.SECTOR_HARD_CEILING_MAX
    value: 90
    status: arbitrary
    site: src/config.py
    note: >-
