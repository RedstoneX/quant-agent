    downgraded: >-
      WAS `sourced`. DOWNGRADED 2026-10-01 (docs/WORK.md item 55), because the
      input its source was measured on no longer exists. The table below was
      built with levels clustered by the flat 1%-of-price rule; item 55 deletes
