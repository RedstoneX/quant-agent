      kind: recording
      state: specified
      where: >-
        docs/board_notes/ `## item 90` -- the 2026-10-01 tranche-three
        routing pass, which specifies each recording field by name
      records: >-
        per refresh, the pre-cap DEMAND rather than the boolean that exists
        today: how many filings the discovery scan would have returned had the
        cap not bound, how long the scan would have run had the deadline not
