# The number ledger -- where every trade-governing number came from.
#
# WHAT THIS FILE IS. The desk's standing rule (docs/OUTCOME.md, and the top of
# docs/WORK.md) is that a number which governs a trade must be read off the
# instrument, derived from something that is itself read off the instrument, or
# carry a written derivation at its definition site. Approval does not make a
# flat number non-arbitrary and neither does backtesting it into place. Until
# 2026-09-18 there was NO MECHANICAL CHECK of that rule at all, so the next
# invented number got in free -- and did.
#
# `src/number_sources.py` enumerates every numeric definition site inside a
# declared scope and requires each one to appear here. `tests/test_number_
# sources.py` fails the build otherwise, and `pytest` is the check branch
# protection requires. Read that module's docstring before editing this file:
# it states the scope rules, the four things this file is checked for, and --
# at the bottom -- what the check structurally cannot catch.
#
# HOW TO ADD A NUMBER. Do not reach for `arbitrary` because it is the easy
# field. Say where the number came from:
#
#   instrument  -- read off the instrument at run time, or fixed by an external
#                  spec the desk does not choose (a broker tick size, an
#                  exchange margin requirement, a statutory deadline).
#                  Requires `source`.
#   sourced     -- a cited derivation or published source, written down.
#                  Requires `source`. A source for a RANGE is not a source for
#                  a point value inside it.
#   derived     -- computed from another entry in this file. Requires
#                  `derived_from` (its id) and `base_value` (what the base held
#                  when the derivation was written). If the base later moves,
#                  the build FAILS -- which is the point: a number can be
#                  sourced when written and unsourced a month later because
#                  what it was derived from changed underneath it.
#   arbitrary   -- live, governs trades, nothing behind it. Honest, and
#                  RATCHETED: `MAX_ARBITRARY_ENTRIES` in src/number_sources.py
#                  is the ceiling. Lower it when one is sourced. Raising it is
#                  an owner decision, not a build fix.
#   not-trade-governing -- in scope structurally, cannot reach a trade
#                  decision. Requires `note` saying why.
#
# `value` must equal the live literal. That is deliberate friction: changing a
# number puts its justification back in front of whoever changes it, instead of
# letting the number outlive it.
#
# SEEDED 2026-09-18 from board item 90. The classifications below are the
# verified inventory that item asked for. NO VALUE WAS CHANGED -- changing a
# live trade-governing number is the owner's call and several are
# ratified-but-unsourced. The 30-odd numbers the 2026-09-11 and 2026-09-14
# audits found are all still live and are all recorded here as `arbitrary`.
