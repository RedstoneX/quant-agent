      makes the desk markedly slower to accept that an adverse move is real?
      That is a risk-appetite question, not a measurement.
      SUPERSEDED 2026-09-30 by the owner ruling that risk tolerance is read
      per name from that instrument's own behaviour and the seats'
      conviction, never set as a global dial: asking the owner to pick one
      global multiple is no longer an available route, and neither is
      adopting 3.0 as a new global literal. The remaining route is therefore
      to replace this constant with a per-name read of how far THIS
      instrument ordinarily travels against a holding -- a reformulation of
      the exit path, not a retune -- which was NOT built here because it
      changes live selling behaviour and no measurement of that per-name
      quantity has been taken yet. The literature (~3 ATR) bounds the answer;
      it does not supply it.
    cost_while_unanswered: >-
      The band that decides whether an adverse move is real sits below every
      published volatility multiple, and it is the measured cause of the
      7-of-8 discretionary exits the reviewer approved and this gate blocked.
    derivation_attempts: >-
      THE TWO ATTEMPTS ARE SPENT; do not open a third blind one. ATTEMPT 1
      (2026-09-26) -- adopt the nearest published volatility-band multiple.
      FAILED: Wilder, the Chandelier Exit and Kaufman all sit near 3 ATR but
      all measure a stop's distance from a RUNNING EXTREME, not an adverse
      move from ENTRY, so they do not measure this quantity; adopting 3.0
      would also be a large unexplained loosening of when the desk sells.
      ATTEMPT 2 (2026-09-30) -- replace it with each name's own historical
      adverse move. BUILT, REVIEWED and REJECTED: the justifying example was
      arithmetically a counter-example, the bar depth was a second chosen
      round number, the measurement windows overlapped so the same days were
      counted repeatedly, a 29-session hold returned ONE observation reported
      as a median, one of the two call sites was left unpatched, and a failed
      bars fetch reverted silently to the wider number. More fundamentally,
      ANY summary statistic of a distribution is a choice of percentile, and
      that choice is exactly the appetite figure this item exists to remove --
      so no statistic over history can ever settle this, and the owner ruling
      that risk is read per name from the instrument, never set as a global
      dial, also closes the "ask the owner to pick a figure" route.
    settlement_route: >-
      Not by measurement over history and not by an owner dial -- both routes
      are closed above. Two live routes remain. (1) The band's FIRST home, the
      midday gate standing in front of every non-external SELL, measures the
      move from the AVERAGE ENTRY PRICE; nothing else in the exit path is
      anchored to what the desk paid, and being anchored to it is precisely
      what the per-name alignment ruling forbids. Removing that gate and
      letting the structure-and-trend test decide removes the number by
      removing the mechanism. That is an exit-behaviour change and is NOT made
      under a record-truth pass. (2) The band's SECOND home, the
      `check_structural_protection` fallback, is the only protection a holding
      with neither a written invalidation nor a qualifying level has; it must
      not be deleted with the first and needs its own answer.
    recording_status: >-
      MEASURED 2026-10-01 against the PRODUCTION database (read-only,
      /home/qamc/quant-agent/data/quant_agent.db, latest row 2026-09-30
      18:15): the machine-readable refusal payload added 2026-09-30 has
      produced ZERO observations. intraday_evaluations holds 334 rows, none
      with a noise-band status and none carrying any `rule=` payload at all.
      The settlement recording for this number therefore exists in code but
      has recorded nothing yet, and the board's headline "7 of 8 discretionary
      exits blocked" is NOT reproducible from that table.

      STRUCTURAL CAUSE FOUND AND FIXED 2026-10-04 (recording only, no
      behaviour change). The emptiness was not only the desk being off. The
      recording was CENSORED BY CONSTRUCTION: in `src/pipeline_exits.py` the
      payload was written only on the branch where the band BLOCKED an exit,
      so every adverse move the band judged large enough to let through was
      discarded, and the band's SECOND home, the `check_structural_protection`
      fallback in `src/risk/exit_guard.py`, emitted no `rule=` payload at all.
      A sample truncated at exactly the threshold under examination can never
      locate that threshold -- it would have contained only moves below 1.0
      ATR and would have been consistent with any multiple whatsoever. Both
      outcomes are now written, tagged `blocked=` / `inside_band=`, and the
      adverse move is carried as an ATR MULTIPLE as well as in dollars, which
      is the unit this constant is denominated in and the only unit in which
      the two homes are comparable. The payload also exposes an asymmetry no
      record previously stated: the midday home widens the band by
      sqrt(sessions held) while the fallback home passes no hold length and
      stays flat at 1.0, so one named constant produced two different widths
      for the same holding on the same day. NOT YET SETTLED: the recording can
      now accrue, but it has still accrued nothing, because the desk is off.
      WHAT WOULD SETTLE IT: the distribution of `adverse_atr_multiple` across
      both outcomes at the moment of a reviewer-approved exit, paired with
      what the position did afterwards -- specifically, the multiple above
      which an adverse move from entry was followed by further adverse travel
      rather than recovery. That requires live sessions with exits in them and
      cannot be manufactured from the 334 rows now on disk.
  - id: src.risk.exit_guard.BREAK_CONFIRMATION_ATR_MULTIPLE
    settles_by:
      kind: recording
      state: specified
      where: docs/board_notes/item-090.md (item 90, the 2026-10-01 tranche-five pass over src/risk)
      records: >-
        every structural break evaluation in `check_structural_protection`, each emitting
        `rule=break_confirmation_margin` with the margin as an ATR multiple, the level tested, whether
        the close cleared it, and whether the level held afterwards -- separately from the noise band,
        which was one literal with this number until 2026-09-26 and may not be re-collapsed with it
      closes_when: >-
        enough break evaluations accumulate to show the margin at which a daily close beyond a level is
        followed by the level staying broken, rather than an ATR magnitude no published work expresses
        in ATRs. The strictly-positive floor on this number is already ratified as an arithmetic
        non-degeneracy bound and that part does not reopen
    value: 1
    status: arbitrary
    site: src/risk/exit_guard.py
    note: >-
      How far beyond a structural LEVEL a completed daily close must sit
      before that level counts as broken -- the margin in
      `check_structural_protection` (src/risk/exit_guard.py) and in the three
      target-revision break tests that import it. NEW ENTRY 2026-09-26, board
      item 70: this is the second of the two jobs the single
      `NOISE_BAND_ATR_MULTIPLE` literal used to do. Same value, no behaviour
      change; the point of the split is that the two jobs can now be answered
      separately, which a shared constant made impossible.
      RESEARCH, 2026-09-26 (docs/INCIDENT_HISTORY.md -- do not re-search): the
      published literature answers this quantity in PERCENT and
      level-dependently, never in ATRs -- Edwards & Magee ~3% for a major
      level and ~1% for a short-term one; Bulkowski's answer is effectively a
      decisive close, i.e. zero distance, with confirmation carried by the
      close count and the throwback behaviour. So there is no ATR basis for
      this number to be sourced against at all: it is unidentifiable in its
      own units, not merely uncited. The confirmation RULE around it IS
      sourced (`TREND_CONFIRMING_CLOSES` = 2, Edwards & Magee); only the
      margin is not.
    open_question: >-
      Re-express the break margin in the units the literature actually uses --
      a percentage of price, scaled by whether the level is major or
      short-term -- or accept an ATR magnitude that nothing identifies.
    derivation_attempts: >-
      TWO HONEST ATTEMPTS, 2026-10-01 (board item 70), both FAILED; the limit
      is two and there must not be a third blind one.
      ATTEMPT 1 -- adopt the literature's own units (Edwards & Magee ~3% of
      price for a major level, ~1% for a short-term one). FAILED for two
      independent reasons. First, choosing WHICH of the two applies needs a
      major/short-term classifier the desk does not have in those terms; its
      only level-importance signal is the touch count, and selecting a cut on
      it would import a second chosen number into a fix meant to remove one.
      Second, 3% and 1% are themselves round picks from a 1948 text calibrated
      on the Dow quoted in eighths; adopting them swaps an unsourced ATR
      multiple for an unsourced percentage, which is not a derivation.
      ATTEMPT 2 -- read the margin live off the instrument as the smallest
      distance at which a close is distinguishable from the level, i.e. the
      instrument's own minimum price increment. This DOES yield a real,
      external, non-degenerate bound and is recorded below as a structural
      floor -- but it bounds only that the margin must be strictly POSITIVE
      (at zero, a close exactly AT a level counts as a break, so every retest
      of a support the stop sits on would lift protection). It derives the
      floor, not the magnitude: 1.0 ATR is orders of magnitude above a
      one-cent increment. FAILED to produce 1.0.
      NOT ATTEMPTED, and must not be: any percentile of this desk's own past
      break outcomes. Choosing where to stand in a distribution IS the
      appetite figure this item exists to remove, and fitting to the desk's
      own trading record is barred outright.
    structural_floor: >-
      RATIFIED 2026-10-01 as a genuine arithmetic non-degeneracy bound, with
      the reason written down: the break margin must be strictly greater than
      zero, because a zero margin makes "closed at the level" identical to
      "closed beyond the level" and would lift protection on every ordinary
      retest of a support the stop is sitting on. This ratifies POSITIVITY
      ONLY. The magnitude 1.0 remains arbitrary and is not ratified by it.
    settlement_route: >-
      Its own route, independent of the noise band (the two were one literal
      until 2026-09-26 and may not be re-collapsed). Settles when the
      recording added 2026-10-01 in `check_structural_protection` -- every
      break evaluation now emits `rule=break_confirmation_margin` carrying the
      margin as an ATR multiple AND as a percentage of the close, with the
      level's touch count -- has accrued enough live evaluations to say what
      1.0 ATR actually IS in the units the literature measures, per name and
      per level importance. Until then the honest status is `arbitrary`.
    cost_while_unanswered: >-
      Whether a support level counts as broken -- and therefore whether the
      desk lifts protection and sells -- turns on a distance that no published
      work measures in these units.
  - id: src.risk.exit_guard.TREND_CONFIRMING_CLOSES
    value: 2
    status: sourced
    site: src/risk/exit_guard.py
    source: >-
      The two-consecutive-day close filter for a level break in Edwards & Magee,
      Technical Analysis of Stock Trends: a level breaks on a decisive close and
      is confirmed on the NEXT day's close, with a reclaim in between resetting
      (a Wyckoff spring). Definition: src/risk/exit_guard.py@`TREND_CONFIRMING_CLOSES = 2`
      and the module note at src/risk/exit_guard.py::TREND_CONFIRMING_CLOSES.
    note: >-
      Consecutive confirmed closes required to treat ANY break as real, in BOTH
      regimes, under the owner mandate 2026-09-24 trend-scaled exit — the
      ratified two-close spring floor, nothing exits faster. The strong-with-
      trend regime adds a STRUCTURAL condition (the prior swing-low must also
      break) on top, never a larger close count. This row governs the CLOSE COUNT
      only. The break MARGIN is a separate quantity and is always
      BREAK_CONFIRMATION_ATR_MULTIPLE, which the 2026-09-26 split (board item
      70) made a distinct constant from NOISE_BAND_ATR_MULTIPLE; the two share
      a value of 1.0 but not a source, and may not be re-collapsed. This note
      said NOISE_BAND_ATR_MULTIPLE until 2026-10-04 — it predated the split
      and contradicted src/risk/exit_guard.py::check_structural_protection.
