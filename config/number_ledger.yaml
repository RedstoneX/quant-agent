# The number ledger -- where every trade-governing number came from.
#
# WHAT THIS FILE IS. The desk's standing rule (docs/OUTCOME.md, and the top of
# docs/WORK.md) is that a number which governs a trade must be read off the
# instrument, derived from something that is itself read off the instrument, or
# carry a written derivation at its definition site. Approval does not make a
# flat number non-arbitrary and neither does backtesting it into place. Until
# 2026-09-18 there was NO MECHANICAL CHECK of that rule at all.
#
# `src/number_sources.py` enumerates every numeric definition site inside a
# declared scope and requires each one to appear here. A "site" is one of
# five shapes: a module-level constant, a `*Config` field default, a
# function-parameter default (id `module.Qual.func(param)`), a numeric
# attribute on any class, or a multiplier/divisor literal in [0.5, 2)
# other than 1 inside a function (id `module.Qual.func:factor[N]`, N in
# source order within that function). `tests/test_number_
# sources.py` fails the build otherwise, and `pytest` is the check branch
# protection requires. Read that module's docstring before editing this file:
# it states the scope rule, the seven things this file is checked for, and --
# at the bottom -- what the check structurally cannot catch.
#
# WHAT THIS FILE IS NOT. It is not evidence that any number here is sourced.
# The gate tests that a justification EXISTS in a shape a reader can open; it
# cannot test that one is TRUE. Read that as a warning about this file rather
# than about the code, because it has already bitten: the entry for the 0.50%
# minimum risk floor was the most scrutinised line in the first version of
# this ledger, was headed "THE CASE THIS CHECK WAS BUILT FOR", and was FALSE
# IN FOUR PLACES --
#
#   * it said the number was absent from config/settings.yaml. It is at
#     config/settings.yaml@`# Spec §2.2 — the most of the total ceiling any`, and that is the LIVE value.
#   * it said the number was absent from every document. It is the
#     owner-ratified risk-envelope row at docs/OUTCOME.md@`| Min risk per trade | 0.5% — below this, do not`.
#   * it said the number was absent from any ratification record. It was
#     ratified 2026-08-27, commit 75c02335.
#   * it said the number existed in exactly one place, while this same file
#     listed it twice -- and a third site (src/config/__init__.py::RiskConfig) was invisible to
#     the scanner because its default was bound to a NAME.
#
# It also cited a comment at src/portfolio_constructor/config.py::ConstructorConfig.min_risk_pct as calling
# that 0.50% "a constructor default nobody chose". That comment is about
# `risk_budget_pct`'s prior value, a legacy NOTIONAL target -- a different
# quantity that shares a digit. Every one of those five claims was one grep
# from being disproved and none was checked.
#
# So: if you are about to cite this file as authority for a number, open the
# citation. That is why `source` must now be a URL or a `path:line` and not
# prose. Seven entries carrying corrected claims are marked CORRECTION
# 2026-09-18 in their notes rather than quietly rewritten.
#
# HOW TO ADD A NUMBER. `arbitrary` is NOT the easy field. Say where the
# number came from:
#
#   instrument  -- read off the instrument at run time, or fixed by an external
#                  spec the desk does not choose (a broker tick size, an
#                  exchange margin requirement, a statutory deadline).
#                  Requires a `source` a non-author can open.
#   sourced     -- a cited derivation or published source, written down.
#                  Requires a `source` a non-author can open: a URL, or a
#                  repo `path:line`. A source for a RANGE is not a source for
#                  a point value inside it.
#   derived     -- computed from, or a second definition site of, another
#                  entry in this file. Requires `derived_from` (its id) and
#                  `base_value` (what the base held when the derivation was
#                  written). If the base later moves, the build FAILS. This
#                  is also how a MIRRORED number is recorded -- one number
#                  with two definition sites is one number, not two, which is
#                  what makes the arbitrary count a count of NUMBERS rather
#                  than of rows.
#   arbitrary   -- live, governs trades, nothing behind it. A DEBT, not a
#                  status. Requires all three of `note`, `open_question` (the
#                  question in a form somebody could actually answer -- a
#                  measurement to take or a ruling to make, not "is this
#                  right?") and `cost_while_unanswered` (what the desk pays
#                  meanwhile). RATCHETED: the count must EQUAL
#                  `MAX_ARBITRARY_ENTRIES` in src/number_sources.py, so
#                  sourcing one means lowering that number in the same commit
#                  and a row cannot leave this file silently.
#   not-trade-governing -- in scope structurally, cannot reach a trade
#                  decision. Requires `note` saying why.
#
# `value` must equal the live literal AND, where the field is reachable from
# config/settings.yaml, the DEPLOYED value there. That second half matters:
# this file records the CODE DEFAULT, and for 52 of these sites the number the
# desk actually trades comes from the YAML.
#
# SEEDED 2026-09-18 from board item 90, reworked the same day after review.
# NO VALUE WAS CHANGED -- changing a live trade-governing number is the
# owner's call and several are ratified-but-unsourced.
numbers:
  - id: src.config.INTRA_CHECK_TICK_MINUTES
    value: 30
    status: sourced
    site: src/config/__init__.py
    source: >-
      src/scheduler.py::TradingScheduler._build_intra_check_trigger (`for tick_min in range(lo_min, hi_min + 1, 30)` in
      `_build_intra_check_trigger`, the authority for how often the intraday
      control actually fires) and src/trading_calendar.py::SESSION_WINDOWS (the window those
      ticks span). Not an independent number: it is pinned in config only so
      the cost circuit's transient-latch cooldown can be derived from the gap
      between consecutive PAID runs instead of chosen, and
      tests/test_cost_circuit.py asserts the two agree by building the real
      trigger and counting its ticks. Changing the schedule changes this;
      changing this alone changes nothing about when anything runs.
  - id: src.config.CashSweepConfig.min_order_usd
    value: 500
    status: arbitrary
    site: src/config/__init__.py
    note: >-
      UNSOURCED AND TRADE-GOVERNING. A round $500 with nothing behind it.
      CORRECTED 2026-10-01 (board item 190): the 2026-09-24 note below said
      this value's only remaining live job was gating the spare-cash SWEEP and
      that it was "fully decoupled from trade sizing everywhere else". That is
      now exactly inverted and must not be repeated. The sweep funding step was
      DELETED with the sweeper (item 190 step 3), so the sweep job is gone,
      while two trade-governing consumers remain and were missed:
      (1) `src/pipeline_stages.py` reads it through `_min_order_usd` and DROPS
      a short scale-in add whose estimated notional falls under it, recording
      `below_min_notional` as an execution skip and a refused `funding`
      pipeline event -- a live refusal to trade;
      (2) `src.rotation.rotation_binding_constraints` appends `funding` to the
      binding-constraint tuple when the entry budget is under this value, and
      `rotation_constraint_clause` renders that tuple into the rotation report
      and the owner-facing funding wording, so the number also decides what the
      desk SAYS is constraining it.
      ALGEBRA CHECKED 2026-10-01, and the answer is no: the floor does NOT
      cancel to a constant fraction of equity and is not a disguised global
      dial. Both sizing paths make the order notional proportional to equity
      (`qty_by_alloc` gives `allocation_pct/100 * total_value`; `qty_by_risk`
      gives `total_value * risk_pct/100 * price / |price - stop|`), so the test
      `estimated_cost < 500` reduces to `fraction_of_equity < 500 / total_value`.
      The equity term survives on one side only. The effective weight threshold
      therefore DRIFTS INVERSELY with account size -- the same floor refuses a
      larger share of the book on a small account than on a large one, and
      silently loosens as equity grows. That is its own defect, and it is the
      reason this is a per-name read waiting to be built rather than a dial.
      RULED 2026-10-01: not deleted, not ratified, value unchanged. A global
      constant governing what the desk may trade is a defect to be replaced by
      a per-name read, not a value for the owner to set.
      DERIVATION ATTEMPT 1 (2026-09-24, FAILED): justify it as the notional
      below which commission makes a trade uneconomic. Refuted by the broker
      fact -- Alpaca charges no stock commission -- after a real incident in
      which a genuine ~$295 trade was refused as "under the $500 minimum order
      ... pays full commission", a false statement. The fix removed the floor
      from all four trade-sizing sites then known: the sector-crowding scale in
      `PortfolioConstructor._apply_sector_crowding_scale`, NEW-entry blocking
      inside `apply_gross_ceiling` via `ConstructorConfig.min_order_usd`, the
      rotation buy-leg gate (retired outright from `REQUIRED_BUY_LEG_GATES`),
      and the execution-time cash re-size refusal. The two consumers above were
      not in that sweep and survived it.
      DERIVATION ATTEMPT 2 (2026-10-01, FAILED to settle): derive it from how
      often it has actually refused an order. Measured read-only against the
      production DB `/home/qamc/quant-agent/data/quant_agent.db`: across 13,823
      `specialist_evidence` rows the entire retained record holds 18
      `execution_skip` rows, of which exactly ONE is `below_min_notional` -- a
      short add refused at a notional well under a fifth of the floor. One
      observation cannot distinguish a floor at $100 from one at $500: every
      candidate value in that range would have refused the same single order
      and permitted everything else on record. The attempt is recorded as
      failed rather than retried; the route below is what would settle it.
    settles_by:
      kind: recording
      state: built
      where: src/pipeline_stages.py `_record_execution_skip`, persisted via src/storage/db.py
      writes:
        - specialist_evidence.kind
        - specialist_evidence.evidence_json
      records: >-
        every order this floor refuses, as an `execution_skip` evidence row
        carrying the reason `below_min_notional`, the symbol, the refused
        notional and the floor it was measured against, alongside the skip rows
        for every OTHER refusal reason so the floor's share of all refusals is
        readable rather than assumed. The recording already exists and is
        already collecting; nothing new had to be built for it.
      closes_when: >-
        enough refusals accumulate to show the distribution of refused
        notionals and what the desk did with each name afterwards, so the
        smallest order worth placing is read off this account's own refused
        orders and their outcomes instead of being a round number. On the
        current rate -- one refusal in the whole retained record -- that is
        the evidence this number is waiting on, and the honest reading is that
        the floor is nearly never binding, which is an argument for the
        per-name read rather than for any particular dollar figure.
    open_question: >-
      What is the smallest order this account should place, read off each
      name's own spread, tick size and the refused-order record, rather than
      one dollar figure applied to every name and every account size?
    cost_while_unanswered: >-
      A small, correct addition to a short position is refused outright, and
      the rotation report calls funding binding, on a number nobody derived --
      and the share of the book that number silently refuses changes as equity
      changes.
  - id: src.config.CashReserveConfig.pct
    value: 1
    status: not-trade-governing
    site: src/config/__init__.py
    note: >-
      RE-FILED from `arbitrary` 2026-10-04. The percent of equity the
