  - id: src.data.levels.CLUSTER_TOLERANCE_PCT_FALLBACK
    value: 1
    status: arbitrary
    site: src/data/levels.py
    note: >-
      SUPERSEDED 2026-09-30, docs/WORK.md item 55. This used to BE the level
      definition: two pivots within 1% of each other were one level. That 1%
      was never shown to be right (this entry said so in its own words) and
      it did not scale with how violently a name moves. It is gone from the
      definition. `_cluster` now groups two pivots when the price RANGES the
      bars actually traded OVERLAP, and the level's width is those bars' own
      combined span - read off the instrument, with no width to pick and
      nothing left to sweep. The open question this entry used to carry ("at
      what price separation do two pivots stop being one level") no longer
      has to be answered, because nothing asks it any more.
      The 1.0 is NOT deleted and this entry stays `arbitrary`, because the
      number is still reachable and still unsourced wherever it is reached.
      It remains reachable in four places, named rather than glossed:
      (1) `level_zone_halfwidth` uses it whenever `zone_low`/`zone_high` are
      absent, non-finite, inverted, or describe a zero-width bar;
      (2) `_cluster` falls back to it to group a pivot whose bar range is not
      a finite number;
      (3) `risk.level_cluster_tolerance_pct` is a live configured parameter
      carrying this value into `src/risk/exit_guard.py` and
      `src/risk/target_revision.py`, where a level with no zone is still
      matched as `price * pct / 100`;
      (4) the alias `CLUSTER_TOLERANCE_PCT` is still exported and is still
      the default argument of the public helpers.
      What DID change is that the number no longer defines a level: every
      level `find_structural_levels` builds from bars now carries its own
      measured zone and never consults this value.
      MEASURED 2026-10-04 - route (2) IS DEAD. `_cluster` reaches the
      fallback only for a pivot whose bar range is not finite, and
      `_clean_bars` makes that unreachable on any real series: it drops every
      bar failing `high > 0 and low > 0 and close > 0 and high >= low`, which
      rejects NaN prints (every NaN comparison is false), zero or negative
      lows, and inverted bars. Over 200 synthetic well-formed series of 260
      bars each, 6147 pivots were produced and ZERO were non-measurable.
      Injecting each corrupt-print class (NaN high, +inf high, inverted bar,
      zero low, -inf low) one bar into a 260-bar series produced 498 pivots
      and ZERO non-measurable in every case. The only surviving route is a
      `+inf` high in a series of 11 to 20 bars, where `_clean_bars` returns
      early without its local-median outlier pass while `_find_pivots` still
      has enough bars to fire; a price feed cannot emit +inf, so this is a
      theoretical branch, not a live one. The value is therefore NOT changed:
      nothing was learned about what the right width is, only that this one
      of its four consumers never asks. Routes (1), (3) and (4) are untouched
      and the row stays `arbitrary` on their account.
    open_question: >-
      What bound should a zone-less level get, when no bar range is available
      to read one off? Unanswered; 1% is a guess standing in for a
      measurement, exactly as before.
    cost_while_unanswered: >-
      Level clustering decides where structure is, and structure places stops
      - so this sets the granularity of every level-backed stop.
      A level reaching the risk seats without a zone is matched on a guessed
      1% band, so a stop can be reported as backed by structure on the
      strength of an unsourced width. docs/WORK.md item 55.
    settles_by:
      kind: measurement
      state: specified
      where: docs/board_notes/, item 90, the 2026-10-01 sixth routing tranche (execution plumbing and the level scan)
      records: >-
        over the universe the desk could trade, the price separation between
        neighbouring pivots and whether a touch near one of them behaves as a
        touch of the other -- bounce rate as a function of separation, expressed
        both in percent and in ATR -- so the width at which two pivots stop
        being one level is read off the instrument rather than halved from the
        narrowest bin some outside study happened to test.
      closes_when: >-
        a separation exists at which the shared-bounce rate falls away, and the
        tolerance becomes that reading in whatever unit the measurement
        supports, percent or ATR. DELETE outcome: if the bounce rate is flat in
        separation, clustering is adding nothing over the raw pivot list, and
        the clustering step and its tolerance go together rather than the
        percentage being re-picked.
