  - id: src.config.SmartMoneyConfig.max_filings_per_refresh
    value: 1000
    status: arbitrary
    site: src/config/__init__.py
    note: >-
      CORRECTION 2026-09-18. This entry read `not-trade-governing`, with the
      note "it decides how long the desk waits or how much it fetches, never
      whether or how much to trade". That sentence was falsified the same
      day: the cap binding is what REFUSED a trading decision. `refresh`
      runs once, pre-market, and stops at this many filings; the residue is
      unread Form 4s, and the research-expiry peek reads an unread filing as
      a new one, so the `smart_money` seat expired on the desk's own backlog
      and the evidence gate declined to decide for the rest of the day. The
      discovery order is now watched-names-first, which is what stops that
      residue containing a name the desk trades -- but the cap is still the
      thing that decides how much of the filing stream is ever read, so it
      governs trades. The value itself is a round 1,000 with no derivation
      recorded anywhere: not read off SEC filing volume, not measured
      against the refresh deadline. NO VALUE WAS CHANGED here -- re-deriving
      it needs a source for daily Form 4 volume.
      UPDATE 2026-09-18 (second pass). This cap no longer decides whether
      the desk trades. The watched residue is now drained by a separate
      pass bounded by the desk's OWN ~100 names rather than by market-wide
      filing volume, and the insider seat's freshness is measured against
      what was FILED since the last confirmed read, not against what is
      unread. The cap now bounds only how much of the wider market's Form 4
      stream is read for external candidate nomination. The status stays
      `arbitrary` because the value is still an undderived round 1,000.
      MEASUREMENT, partial and recorded as such: SEC's daily index for
      2026-09-17 listed 1,457 Form 4 filer rows and 2026-09-16 listed
      1,277 (fetched directly from
      /Archives/edgar/daily-index/2026/QTR3/form.<date>.idx, 2026-09-18).
      Those are FILER rows, and one Form 4 produces one row per filer
      (issuer plus each reporting owner), so the distinct-accession count
      per day is materially lower than those figures and was NOT
      established -- a follow-up attempt to count distinct accessions was
      rate-limited (HTTP 403) by SEC and is not reported here as a number.
      Do not treat 1,457 as a per-day accession count. `_discover` now
      records EDGAR's own per-day total (`busiest_day_total`, read from
      `hits.total.value`, which was previously fetched and discarded) so
      the cap can be read off the instrument on a later pass.
      UPDATE 2026-09-20 (board item 126). That same per-day total is now
      also kept per day slice and reported as coverage:
      `edgar_coverage` on the refresh result and in the Form 4 manifest
      carries EDGAR's own count, how many rows the scan walked, the ratio
      of the two, and named reasons. NO THRESHOLD WAS ADDED and no cut
      point is derived from the ratio -- the only judgement made is
      `verified`, which is the exact condition "every day slice queried
      handed back a readable count and no page stopped short of one".
      This cap binding is explicitly NOT one of the reasons that clears
      `verified` (see `UNVERIFIED_EDGAR_REASONS` in
      src/data/smart_money.py): a budget spent as designed is not a failed
      read. The open question below is unchanged and still unanswered.
      CAVEAT for whoever answers it, found 2026-09-20 in review and
      measured live: EFTS caps `hits.total.value` at exactly 10,000 and
      marks it `relation: "gte"`. `_edgar_total` now returns None for a
      capped count, so `busiest_day_total` can never silently pin at the
      platform's ceiling and be mistaken for a measurement of filing
      volume. Daily Form 4 volumes sampled during that review ranged 435 to
      2,805 [measured 2026-09-20 against efts.sec.gov, twelve days], well
      under the cap, but these are day counts and NOT the distinct-accession
      figure this open question asks for at the market-wide level.
      CORRECTION 2026-09-23. The 2026-09-18 second-pass sentence above --
      "the cap now bounds only how much of the wider market's Form 4
      stream is read for external candidate nomination" -- was FALSE from
      the moment it was written until today, and the value was not what
      made it false. The same PR gave `_discover` an exit condition of
      `len(priority) >= cap` whenever watched names were supplied.
      `priority` holds only the ~82 watched issuers' filings, so it could
      not reach 1,000, production always supplies watched names, and the
      scan's only remaining terminator was `refresh_deadline_s`. The cap
      therefore bounded NOTHING: discovery spent the whole 180 s
      paginating and the market-wide read loop raised on an expired
      deadline. Market-wide reads went 1,000/run on 2026-09-15..18 to 0,
      31 and 13 on 2026-09-21..23 -- and the 31 and 13 were the watched
      drain's, not this pass's -- while the backlog grew 10,229 ->
      16,782 -> 21,217 [measured: production log and the Form 4 manifest].
      The exit condition is now `len(other) >= cap` unconditionally and
      the sentence is true again. NO VALUE WAS CHANGED, here or anywhere,
      by that fix: at the measured steady-state inflow of 247 unread
      listed-issuer Form 4s/day [21,217 pending / 86 days queried,
