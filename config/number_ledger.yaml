      exception, and it governs whether the desk re-asks the provider once at
      a smaller allowance. It never enters a price, a size, a stop or a
      ranking. Falsifiable: if the provider ever signalled credit exhaustion
      with a different status, this equality test would stop matching and the
      re-ask would never fire.
