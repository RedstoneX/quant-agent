      10 calendar days "covers the next few sessions the event_risk field asks
      about" -- a restatement, not a derivation, and in calendar days rather
      than sessions (board item 91). An event past this horizon is invisible
      to every seat, so it decides which trades are taken into a known
      catalyst.
    open_question: >-
      Over what forward window does a macro release measurably move the names
      this desk holds - i.e. how far ahead does the calendar have to look to
      be useful rather than noise?
    cost_while_unanswered: >-
      Too short and the desk positions into a release it never saw; too long
      and the seat skims past rows it will not act on.
