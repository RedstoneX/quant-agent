  # REMOVED 2026-09-30 (board item 186): the entry for
  # src.data.correlation.CLUSTER_CORRELATION_THRESHOLD = 0.7 is gone because
  # THE NUMBER IS GONE. It is not ratified, not re-derived and not replaced by
  # another number. The research pass recorded here had already concluded the
  # cutoff was not sourceable (published thresholded-correlation-network
  # values span roughly 0.3-0.8, chosen for the network density a study
  # wants; the mainstream portfolio-clustering literature thresholds nothing
  # at all) and had named the structural alternative. The owner's 2026-09-30
  # ruling — risk tolerance is never a global dial, it is read from structure
  # or per name — made that alternative the required answer rather than an
  # option, so the routed owner-appetite question is WITHDRAWN, not pending.
  #
  # WHAT SHIPPED. src/data/correlation.py now clusters on Mantegna's
  # correlation distance d = sqrt(2 * (1 - |corr|)): build the minimum
  # spanning tree of the held book and cut it at the largest gap in its own
  # sorted edge lengths. The cut is read from the book in front of the desk,
  # not picked. The only constant left is one fixed point of the metric
  # itself — the distance at corr = 0, "no relationship" — which closes the
  # top of the gap search and is never compared against a correlation to
  # decide membership; it is a property of the formula, not a level, so it is
  # deliberately NOT ledgered as appetite.
  #
  # STABILITY, MEASURED 2026-09-30 because a small book's tree has few edges
  # and a moving cut would swing rationing with no market event behind it. On
  # an 11-name book with three real themes (within-theme corr 0.78-0.90,
  # cross-theme 0.35-0.50, three loners), nudging every correlation by up to
  # 0.03 moved the partition in 0 of 400 draws. An earlier version of the cut
  # also bracketed the edge lengths at the other end (d = 0, "identical");
  # that version flipped in 11.8% of the same 400 draws AND returned no
  # clusters at all on that book — a false negative in the exact case this
  # code exists for — so the lower bracket was removed rather than guarded.
  # The cost of having only the upper bracket is that a book with no
  # structure at all, including any two-name book, comes back as ONE cluster
  # instead of none. That is the conservative direction (it rations harder,
  # never softer) and it is pinned by test.
  #
  # STILL TRANSITIVE, and that is the correct behaviour here: single linkage
  # chains, so A~B and B~C is one bet even when A and C are apart, which is
  # how a theme actually transmits (the nuclear names are one bet whether or
  # not every pair inside is tight). The difference from the old cutoff is
  # that a chain now only forms through links that are tight RELATIVE TO THE
  # REST OF THE BOOK instead of as far as a fixed number allowed.
  #
  # This is rationing only. It never asks the desk to buy to diversify;
  # conviction still outranks balance.
  #
  # The risk rule feeding max_cluster_risk_share_pct now asks for cluster
  # membership (`cluster_peers`) instead of "who is above 0.7". The old
  # pairwise helper survives only for callers supplying an explicit level of
  # their own, and it no longer has a default.
