  - id: src.data.technical.LONGEST_INDICATOR_WINDOW
    value: 200
    status: sourced
    site: src/data/technical.py
    source: >-
      The 200-session simple moving average, the standard long-term trend
      reference every chart package plots as the "200-day MA"; its academic
      standing traces to Brock, Lakonishok & LeBaron (1992), "Simple Technical
      Trading Rules and the Stochastic Properties of Stock Returns", J. Finance
      47(5), which studied the 1-200 moving-average pair among others. Only the
      MA WINDOW is sourced -- the desk plots it as a trend reference; it is no
      longer a data-sufficiency test (that use was removed, board item 180).
      Definition site and reasoning: src/data/technical.py::atr_series.
    note: >-
      RE-SOURCED 2026-09-25 (board item 180, owner ruling): back to `sourced`
      after a 2026-09-23 spell at `arbitrary`. It went `arbitrary` because the
      constant had TWO uses and the schema carries one status per site: USE ONE
      (the `rolling(200)` moving-average window) is sourced -- 200 is a
      conventional published trend reference, named here not chosen here -- but
      USE TWO, the constructor's young-listing
      refusal (a since-removed function), read the same 200 as a data-sufficiency gate with no citation
      anywhere, so the row took the weaker use's status. The owner has now
      DROPPED that refusal (a young listing is judged on whether a protective
      stop is readable from whatever bars exist, via the existing
      `_derive_structural_stop_no_atr` / STOP_REFUSAL_NO_STRUCTURAL_STOP_NO_
      VOLATILITY path, not on a bar count). USE TWO is gone, so the only
      remaining use is the sourced MA window and the row is `sourced` again.
      Not resolved by lowering 200 -- the owner ruled that out (Brock,
      Lakonishok & LeBaron (1992) chose 1-200 for POPULARITY on the DJIA
      index, not as a data-sufficiency test); the count gate was removed, not
      replaced. The exit guard already returns UNPARSEABLE for a
      `thesis_invalid_if` referencing MA200 when `ma_200` is None
      (src/risk/exit_guard.py), so admitting a young name whose `ma_200` is
      None does not ship an unevaluable exit -- the board's hard prerequisite,
      verified already present on main. The two neighbouring history counts
      (`min_external_history_days` 20, src/universe_screen.py's ~210) are
      SEPARATE gates in their own modules and out of this item's scope.
