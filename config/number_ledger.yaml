      level below entry at any touch count (>= MIN_TOUCHES = 2), plus the
      already-ratified `structural_stop_buffer_pct`, give a floor read off
      the chart instead of off this multiple? Item 191 settles what
      fraction of real candidates that covers and what the stop does when
      no computed level exists below entry at all, which is the only
      population an ATR multiple would still govern. 2.5 is the INTERIM
      value meanwhile and is deliberately not re-picked: with no cited
      band, moving it would be one more unsourced choice.
    cost_while_unanswered: >-
      Two costs, and the second was omitted from this field until
      2026-09-30. FIRST, every unbacked stop and every position size
      derived from it rests on an uncited number; because sizing is
      risk-based the dollar loss if the stop fills does not change with
      it, so what moves is position size and how often noise stops the
      trade out. SECOND, and this is the one that is invisible: this
      number also sets the universe screen's volatility ceiling
      (`STOP_SANITY_FLOOR_FRACTION` divided by the widest reachable
      multiple), so it removes names from consideration ENTIRELY, before
      any seat analyses them. A name screened out is never seen, never
      logged as a refusal, and never appears in any review — so the cost
      of this number is paid mostly where nobody can observe it. That gate
      ships disabled today (`universe_screen.enabled: false`), which
      bounds the live cost to sizing alone; it does not bound the cost if
      the screen is ever switched on.
      ITEM 199 OUTCOME 2026-09-30: the chart cannot replace this number, and
      the population it governs is stated here rather than assumed. Measured
      over 867 production technical-seat candidates carrying entry price,
      ATR14 and computed levels: 97.2% have a computed level at or below entry
      at any touch count, but the NEAREST such level sits closer to entry than
      this flat floor for 71.8% of them (gap distribution in ATRs: p10 0.15,
      p50 1.41, p75 2.65, p90 5.14, max 10.1). A structural level used as a
      WIDENING anchor therefore changes nothing for roughly seven candidates
      in ten, and on the 28.2% where it does bind it runs out to 10.1 ATRs,
      which is a four-fold position-size cut. Capping that widening at this
      multiple makes the rule arithmetically inert; any other cap is a new
      invented money number. So this value governs the WHOLE unbacked-stop
      population, not a residue, and its status stays arbitrary. The only
      thing that can change that is an owner-appetite dial: the maximum stop
      widening, in ATRs, the desk will accept in order to sit behind real
      structure. It is deliberately not picked here.
