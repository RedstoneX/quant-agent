      stop would sit at or below zero. Main's form is kept and this
      branch's narrower form is dropped. What survives from this pass is
      the FINDING, which item 185 confirms: dividing by the bare base was
      false across a band of names, and the divergence was exactly the
      risk-off scaler 1.20. Also withdrawn as wrong on the facts: the
      board's note that the screen fix "needs the owner's call because it
      tightens a live screen" — `universe_screen.enabled` is False in
      config/settings.yaml, so the screen does not ship on.
      ITEM 185, 2026-09-30 — NEW DOWNSTREAM CONSUMERS, and an honest note
      about what that means. This value is now one of three factors in
      `portfolio_constructor.widest_reachable_stop_atr_multiple` (base x
      largest setup scaler x largest regime scaler = 2.5 x 1.00 x 1.20 =
      3.00), which board item 185 made the basis of TWO further rules: the
      midday TRAIL_STOP clamp and the universe screen's ATR/price
      volatility ceiling (1 / 3.00). Those two used to carry a flat 0.5
      literal between them; that literal is deleted and its row is gone.
      Do not read the composition as a derivation. It removes one
      independent arbitrary literal and creates a live dependency on THIS
      row and on `stop_atr_regime_scale[0][1]`, both of which remain
      `arbitrary` with open questions. The arbitrary content of the desk is
      unchanged by item 185; only the number of independent literals fell.
      Board item 185 therefore STAYS OPEN.
    open_question: >-
      NOT a point-inside-a-band question any more; that framing is
      withdrawn with the band (see note (c) — there is no citation, so
      both ends are unsupported). The answerable question is now whether
      this constant can be reformulated away for most of the names it
      governs, and it is answered by BUILDING item 199, not by a ruling:
