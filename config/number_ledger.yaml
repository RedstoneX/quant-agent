  # nominations.max_per_seat_per_run, read at run time. No arbitrary row
  # was added by this feature.
  - id: src.config.UniverseScreenConfig.min_price_usd
    value: 5
    status: sourced
    site: src/config/__init__.py
    source: >-
      SEC Rule 3a51-1(d), 17 CFR 240.3a51-1: a security that "has a price of
      five dollars or more" is excluded from the definition of penny stock.
      https://www.law.cornell.edu/cfr/text/17/240.3a51-1 (fetched
      2026-09-19). The owner's instruction was to filter out penny stocks;
      this is the statutory line for one. Price here is the last completed
      daily close.
  - id: src.config.UniverseScreenConfig.min_market_cap_usd
    value: 30000000
    status: sourced
    site: src/config/__init__.py
    source: >-
      FTSE Russell US indexes methodology overview, ineligible securities:
      "Companies under $30 Million in total market capitalization".
      https://www.lseg.com/content/dam/ftse-russell/en_us/documents/other/ftse-russell-us-indexes-methodology-overview-cut-sheet.pdf
      (fetched 2026-09-19). The floor of the Russell 3000E, the broadest
      published US investable-equity index. Market capitalisation is read
      from yfinance at screen time.
  - id: src.config.UniverseScreenConfig.screen_deadline_s
    value: 900
    status: not-trade-governing
    site: src/config/__init__.py
    note: >-
      Wall-clock budget for one incremental screening pass at the end of
      the evening session. Decides how many symbols are screened TONIGHT,
      never whether one passes; an unfinished pass resumes next evening.
      Derivation at src/config/__init__.py (UniverseScreenConfig): evening job
      TimeoutStartSec=1260, evening body measured 173 s on 2026-09-19.
