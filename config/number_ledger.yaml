      a name's current daily range in the first sessions after the tape turns
      risk-off? That is answerable per name from daily bars alone (ATR(14)
      against a short-window range over the turn), with no reference to what
      this desk traded or earned. If the lag gap is small, the honest fix is
      to DELETE the scaler as double-counting rather than to re-pick it; if it
      is large, the scaler should be a per-name read of that gap and not a
      global 1.2, per the owner's 2026-09-30 ruling that risk is per name.
      THE RECORDING THAT WOULD SETTLE IT, which does not exist today: persist,
      per name and per session, the regime label this desk assigned alongside
      that name's own ATR(14) and realised daily range, so the lag gap can be
      measured against the desk's own live regime calls from instrument data
      only. Nothing in `data/quant_agent.db` stores the regime label next to a
      per-name volatility reading today, which is why this stays open.
    cost_while_unanswered: >-
