      the watched/core universe on a typical day -- read that off production
      `insider_purchase_clusters` output before treating 5 as anything but a
      placeholder ceiling?
    cost_while_unanswered: >-
      Set too low, a day with more than 5 genuine clusters loses the
      cross-symbol crowd-out protection for the excess ones, silently
      reproducing the original defect for those symbols. Set too high, the
      reservation could itself crowd out non-cluster rows that would
      otherwise have made the cut -- the exact failure mode this fix exists
      to avoid on the other side.
