    id: src.risk.constants.REWARD_RISK_FLOOR
    note: 'OWNER APPETITE, declared 2026-10-02 (fix #4, first slice). This number cannot be derived
      and the `measurement` route previously attached to it could not have closed it, because the
      quantity it would measure -- this desk''s hit rate -- is measured off this desk''s own fills,
      which the owner has ruled measures its bugs rather than its edge, and because a reward-to-risk
      floor is a statement about payoffs the desk is WILLING to take, not about payoffs the market
      offers. The only non-arbitrary content in the number is the algebra: a floor of R means the
      desk is declining anything that needs better than 1/(1+R) of its attempts to work out merely
      to break even, so 1.5 is the statement `fewer than two in five of these need to work`. THE QUESTION
      THE OWNER WOULD BE ANSWERING, in plain words: when a buy would risk a dollar to make less than
      a dollar fifty, should the desk rank it below every buy that would not, or treat payoff as none
      of its business and rank purely on conviction? NO VALUE IS PROPOSED HERE and the live 1.5 is
      unchanged; a number invented to answer an appetite question is the exact failure this ledger
      exists to stop. PRIOR NOTE, kept verbatim: Not a gate and not a size cap anywhere (owner ruling
      2026-09-17); what survives is an ordering signal into rank_verdicts. Ordering still changes
      which names get taken when the book is full, and the reference point itself has no source. See
      board item 110 for the document that still describes it as a size cap.'
    open_question: Should the floor exist, and at what measured hit rate? The inert `RiskConfig.min_reward_risk_after_widening`
      / `ConstructorConfig.min_reward_risk_after_widening` keys that shared this open question were
      removed as dead code, board item 81 (2026-09-24) — this constant is the only survivor, kept
      as an exported name tests/docs still import.
    settles_by:
      closes_when: the owner answers the plain-language question in this entry and the answer is recorded
        with its reason, at which point the row becomes a ratified structural bound rather than an
        unanswered one; no amount of market data closes it
      kind: ratified-bound
      records: the owner's ratified value, the plain-language question it answers, and the fact that
        the quantity is a preference rather than an observable, so no later reader re-opens it as
