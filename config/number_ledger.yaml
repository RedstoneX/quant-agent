      https://files.alpaca.markets/disclosures/library/BrokFeeSched.pdf , and
      https://docs.alpaca.markets/us/docs/margin-and-short-selling (fetched
      and confirmed 2026-09-18; the Elite tier is 4.75%). Applied on the
      broker's own (debit x rate)/360 convention at src/margin_interest.py:1.
      The fee schedule says the rate MAY CHANGE OVER TIME, so this is a source
      with an expiry. The definition site src/config.py:921 already labels
      every figure derived from it an ESTIMATE until the broker's own INT
      activity confirms paper accounts are charged at all.
