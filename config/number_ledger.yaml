  - id: src.config.RiskConfig.absolute_min_stop_atr_multiple
    value: 1
    status: arbitrary
    site: src/config.py
    note: >-
      The HARD FLOOR under every stop this desk sets. A level-backed stop is
      honoured however tight down to this many ATRs; inside it the stop is
      pushed out to exactly this floor (src/config.py:840-848). It was hidden
