  - id: src.config.RiskConfig.absolute_min_stop_atr_multiple
    value: 1
    status: arbitrary
    site: src/config.py
    note: >-
      The HARD FLOOR under every stop this desk sets. A level-backed stop is
      honoured however tight down to this many ATRs; inside it the stop is
      pushed out to exactly this floor (src/config.py:840-848). It was hidden
      from the first version of this gate by a blanket 1.0 exclusion justified
      as "the identity, not a setting". It is not an identity.
      src/config.py:842 says section 12.1's safety argument rests on the same
      1xATR figure in config/prompts/tech_analyst.md - a PROMPT, which
      Invariant 2 says cannot be the final authority.
    open_question: >-
      What stop distance, in ATRs, is so tight that a level-backed stop is a
      guaranteed whipsaw regardless of the structure behind it?
    cost_while_unanswered: >-
      The last line of defence under every tight stop is a round number
      mirrored from prompt prose.
  - id: src.config.RiskConfig.breakout_projection_atr_multiple
    value: 1
    status: sourced
    site: src/config.py
    source: >-
      src/config.py:884 and src/data/levels.py:766-769. 1.0 means the
      projection IS the instrument's typical excursion over the stated horizon
      and nothing more, so the claim is read off the instrument rather than
      chosen. Note the documented interaction with min_stop_atr_multiple at
      src/config.py:880-883.
    note: >-
      The measured move claimed when no structural level stands in the way, in
      sqrt(session)-scaled ATRs (src/config.py:879-884).
  - id: src.config.RiskConfig.daily_loss_risk_multiple
    value: 1.34
    status: derived
    site: src/config.py
    source: >-
      Scales the 5-session drawdown anchor to a one-day window. The definition
      site states that the RELATIVE scaling between windows is doctrine and is
      what was fixed; the anchor it scales (drawdown_5d_risk_multiple) is
      itself INHERITED and unsourced, so this entry records a real derivation
      over an arbitrary base. That is not a laundering trick: recording it as
      `derived` is what arms the base-drift check, so if the anchor is ever
      re-derived this number cannot silently keep a ratio computed against the
      old one.
    derived_from: src.config.RiskConfig.drawdown_5d_risk_multiple
    base_value: 3
  - id: src.config.RiskConfig.drawdown_20d_risk_multiple
    value: 4
    status: arbitrary
    site: src/config.py
    note: >-
      The 20-session arm of the same brake ladder. The RELATIVE scaling
      between windows is doctrine per the definition site; the absolute value
      inherits the unsourced 5d anchor and no separate derivation is written
      down. Not recorded as `derived` because the arithmetic tying it to the
      anchor is not stated anywhere -- claiming a derivation nobody wrote
      would be worse than admitting there is none.
    open_question: >-
      What 20-session peak-to-trough drawdown, measured in multiples of this
      book's OWN realized volatility, marks a regime the desk should de-risk
      into?
    cost_while_unanswered: >-
      The brake fires early on an ordinary volatile stretch, or late on a
      genuine drawdown.
  - id: src.config.RiskConfig.drawdown_5d_risk_multiple
    value: 3
    status: arbitrary
    site: src/config.py
    note: >-
      The ANCHOR of the drawdown-brake scaling, and the definition site says
      so plainly: "still INHERITED, not re-derived: there is no measured
      drawdown/track record to validate it against" after the 2026-09-02 reset
      wiped the equity history. Everything else in the brake ladder hangs off
      this one number.
    open_question: >-
      Same question at the 5-session window. src/config.py:576 says the 3 is
      INHERITED, not re-derived, with no measured drawdown record to validate
      it against.
    cost_while_unanswered: >-
      This is the ANCHOR the one-day multiple is derived from, so its error
      propagates into the daily brake.
