    site: src/risk/alignment_exit.py
    note: >-
      Give-back below the last CHART MARK (a moving average, or the level
      `check_structural_protection` confirmed broken), in the name's own
      ATR, before the alignment exit reads the move as over. AN OWNER
      APPETITE DIAL, recorded as arbitrary on purpose. A draft of this
      entry claimed the value was SOURCED to Wilder's Volatility System
      ARC (~2.8-3.1, New Concepts, 1978) and Le Beau's Chandelier Exit
      (3.0 x ATR default). That claim is WITHDRAWN, for three reasons.
      (1) The `NOISE_BAND_ATR_MULTIPLE` note gives TWO reasons for
      refusing 3.0 and the draft answered only the anchor one; the other
      stands -- "how readily the desk blocks a sale is owner appetite".
      (2) Wilder and Le Beau measure give-back from a running EXTREME
      (highest high since entry); this measures it from a MOVING AVERAGE,
      which sits materially below an extreme, so the same multiple is a
      looser stop and their calibration does not transfer. (3)
      Chandelier's 3.0 is calibrated on ATR(22); this divides by ATR(14).
      The published 2.5-3.5 band is retained as CONTEXT for the order of
      magnitude only. Deliberately NOT reused from
      `src.risk.exit_guard.NOISE_BAND_ATR_MULTIPLE`, which is 1.0 and
      measures excess over noise FROM ENTRY.
    open_question: >-
      Where the desk sits is the owner's dial, left at 3.0 until he moves
      it: tighter realises gains sooner and whipsaws more often, looser
      gives more back. No research can settle it -- see reason (1).
    cost_while_unanswered: >-
      Until the owner sets the dial, every alignment exit realises its
      gain 3.0 ATR below the last chart mark. Too loose and a finished
      move hands back more than it needed to before the desk sells; too
      tight and a live trend is sold into an ordinary pullback and the
      rest of the move is forgone. The exposure is the whole unrealised
      gain of any position this exit fires on.
