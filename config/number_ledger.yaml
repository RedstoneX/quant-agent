  - id: src.config.RiskConfig.daily_loss_risk_multiple
    value: 1.34
    status: derived
    site: src/config.py
    derived_from: src.config.RiskConfig.drawdown_5d_risk_multiple
    base_value: 3.0
    source: >-
      Scales the 5-session drawdown anchor to a one-day window. The
      definition site states that the RELATIVE scaling between windows is
      doctrine and is what was fixed; the anchor it scales
      (drawdown_5d_risk_multiple) is itself INHERITED and unsourced, so this
      entry records a real derivation over an arbitrary base. That is not a
      laundering trick: recording it as `derived` is what arms the
      base-drift check, so if the anchor is ever re-derived this number
      cannot silently keep a ratio computed against the old one.
  - id: src.config.RiskConfig.drawdown_20d_risk_multiple
    value: 4.0
    status: arbitrary
    site: src/config.py
    note: >-
      The 20-session arm of the same brake ladder. The RELATIVE scaling
      between windows is doctrine per the definition site; the absolute
      value inherits the unsourced 5d anchor and no separate derivation is
      written down. Not recorded as `derived` because the arithmetic tying
      it to the anchor is not stated anywhere -- claiming a derivation
      nobody wrote would be worse than admitting there is none.
  - id: src.config.RiskConfig.drawdown_5d_risk_multiple
