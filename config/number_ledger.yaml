  - id: src.config.EventRiskConfig.horizon_days
    settles_by:
      kind: measurement
      state: specified
      where: docs/board_notes/item-090.md (the 2026-10-01 eighth routing tranche)
      records: how many sessions ahead of a scheduled event the realised daily range of a name is
        elevated above its own baseline, measured over the universe the desk could trade, on public
        daily bars across many scheduled events, so the lookahead window is read off when event risk
        actually begins rather than picked at two trading weeks
      closes_when: the elevation-versus-days-ahead curve is in hand and the horizon is set where elevation
        becomes indistinguishable from baseline; it is DELETED, and event proximity stops being a
        sizing or gating input, if no pre-event elevation is measurable at any horizon
    value: 10
    status: arbitrary
    site: src/config/__init__.py
    note: >-
