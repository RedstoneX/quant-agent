  - id: src.risk.trailing.CHANDELIER_ATR_MULTIPLE
    value: 3
    status: sourced
    site: src/risk/trailing.py
    source: >-
      The Chandelier Exit's published default multiple is 3.0 -- Chuck LeBeau,
      the indicator's originator -- documented by StockCharts ChartSchool
      (https://school.stockcharts.com/doku.php?id=technical_indicators:chandelier_exit)
      and Corporate Finance Institute
      (https://corporatefinanceinstitute.com/resources/wealth-management/chandelier-exit/).
      NUANCE: only the MULTIPLE (3.0) is sourced, not the whole formula. The
      desk's fallback trail multiplies this by a PASSED-IN ATR off the
      highest-high / lowest-low since entry (src/risk/trail_evaluate.py::evaluate_trailing_stop,271),
      NOT the published indicator's fixed 22-bar lookback and ATR(22); so the
      3.0 multiple carries this citation, the surrounding geometry does not.
  - id: src.risk.trail_tick.MIN_RATCHET_TICKS
    value: 1
    status: instrument
    site: src/risk/trail_tick.py
    source: >-
      SEC Rule 612 (Regulation NMS, 17 CFR 242.612), the minimum pricing
      increment: no order may be priced in an increment smaller than
      $0.01 at or above $1.00, or $0.0001 below $1.00.
      https://www.ecfr.gov/current/title-17/section-242.612 ONE tick is
      not an appetite: two prices less than one increment apart are the
      SAME price once the venue quantizes them, so a sub-tick amend
      cannot change the resting stop at all. The count is 1 because that
      is the smallest difference that is a difference; any larger count
      would be a picked churn appetite, which is what this retired.
    note: >-
      RETIRED AND REPLACED 2026-10-02. The 2% floor (MIN_RATCHET_PCT = 2.0)
      is GONE. A proposed stop must now clear the live stop by one VENUE
      TICK -- the smallest price increment the venue will accept, Alpaca's
      published $0.01-at-or-above-$1 / $0.0001-below split (SEC Rule 612),
      the same split `src/execution/broker_parts/stop_amend_pure.py::_quantize_price`
      and `src/execution/stop_records.py::_prices_match` already carry.
      DERIVATION: two prices less than one tick apart are the SAME stop
      after the venue quantizes them, so a sub-tick amend cannot improve
      protection by construction; the floor is a reading off the instrument,
      not a chosen appetite. The condition this entry itself named for
      retirement has fired: `_amend_resting_stop_price` is on main (verified
      against origin/main 2026-10-02), so a stop move is an atomic in-place
      amend with no instant of naked protection, which was the ONLY
      surviving cost defending the percentage gate.
      REJECTED ALTERNATIVES. (a) No minimum at all -- rejected: with no
      floor a proposal a hundredth of a cent above the live stop quantizes
      to the same price, so the desk would amend a resting order to the
      price it already rests at, spending a broker call and an
      owner-visible "stop moved" line for a stop that did not move.
      (b) A smaller percentage (0.5%, 1%) -- rejected as the identical
      failure to the 2.0 it would replace: a picked constant, and one that
      still demands a ratchet three times larger on one name than another
      when expressed in each name's own ATR (measured 2026-09-30, below).
      (c) k x ATR -- already measured and failed 2026-09-30, below.
      COSTS MEASURED, not assumed. Money: zero (commission-free US equity
      orders; an amend crosses no spread and prints no fill). Rate limit:
      nothing on the stop path counts or budgets requests -- the only 429
      handling in src/execution is the trade-stream reconnect -- and the
      deterministic trail runs once per session per position, so the amend
      count is bounded at one per position per session whatever the floor
      is; a floor cannot reduce a bound of one. Rejection: an amend the
      venue cannot apply returns the amender's sentinel and the caller
      falls back; this repo records no measured amend-rejection rate, so
      none is claimed. Owner noise: real, and it is exactly what the tick
      floor removes -- the only amends it suppresses change no price.
      HISTORY BELOW is kept verbatim because it records why the 2% floor
      survived three earlier passes.
      A proposed stop must sit at least this far above the live stop.
      src/risk/trailing.py@`existing call site — which only ever knows about` says it mirrors the reviewer's historical ">=
      1.02x old stop" min-bump rule so the deterministic path does not churn
      orders the discretionary one would have skipped. CORRECTION 2026-09-18:
      the first version rendered that as the quotation "new_stop >= old_stop x
      1.02", which is a paraphrase presented as a quote. CAMPAIGN REVIEW
      2026-09-25: the adversary reviewed this and the ~2-4-session ratchet
      cooldown (src/pipeline.py `_trail_tightened_recently`) and RULED
      not-to-reform, staying `arbitrary` — status quo kept, no behavior
      change. It is ratified as owner CHURN-appetite: a chosen
      "is this move worth an order" threshold, not a derived or measured
      number.
      ITEM 185 PASS 2026-09-26 — the premise of the old open question is
      WRONG and is corrected below. It said live capital would eventually
      supply the commission, spread and replace cost that settles this. It
      will not: US-listed equity orders at this desk's broker are
      commission-free (Alpaca's published brokerage fee schedule and its own
      commission/clearing-fee support page), and REPLACING a resting
      protective stop crosses no spread and prints no fill, so the replace
      costs nothing monetary whether the account is paper or live. There is
      therefore no future measurement of "the cost of one more stop
      replacement" that could derive 2.0, because the quantity the old
      question wanted to measure is approximately zero. The real cost of
      churn here is operational — order rate limits, the replace-latency
      window in which the position is briefly unprotected, and alert noise —
      not per-order fees. That leaves the number exactly where the
      2026-09-25 adversary ruling put it: a chosen churn-appetite threshold,
      ratified, neither sourceable nor measurable.
      ATR RE-EXPRESSION ATTEMPTED AND FAILED 2026-09-30. The doctrine
      objection was tested, not waved through: expressed in each name's own
      ATR(14), "2% of the live stop" demands 0.31 ATR on MRVL, 0.33 on NET,
      0.34 on RKLB, 0.47 on AMD, 0.52 on META and 0.91 on AAPL — the same
      nominal rule asking for a ratchet nearly three times larger on one name
      than another, which is exactly the incoherence the doctrine names. The
      repair `k * ATR` was then measured against the seven production
      refusals whose candidate could be reconstructed from daily bars, and it
      does not work: every refused tighten fell between 0.12 and 0.50 ATR, so
      any k >= 0.75 blocks all seven (strictly MORE than the flat 2%, which
      lets one through) and only k <= 0.5 admits anything — and picking 0.25
      to admit three of seven is fitting the constant to the outcomes the
      data liked, the same failure as the 2.0 it would replace. No published
      work fetched fixes a minimum stop-ADJUSTMENT size; the stop literature
      addresses distance from price, which the noise band and the chandelier
      already answer. Deleting the gate was rejected on a measured cost, not
      a preference: `AlpacaBroker.replace_stop_loss` cannot edit an Alpaca OTO
      stop leg in place, so every replace is cancel-then-resubmit with a real
      window in which the position carries no protective order, and removing
      the gate would have added seven such windows across nine evaluation
      runs on an eleven-name book. The value stays 2.0 and the failure is on
      file rather than quietly dropped.
      CONTINGENCY RECORDED 2026-09-30 (second pass, same day): the rejection
      of "delete the gate" rests ENTIRELY on that naked-protection window,
      and that window is being removed. Open PR 806
      (`fix/atomic-stop-amend`, "Move a protective stop in place instead of
      cancel+resubmit") adds `_amend_resting_stop_price` to
      `src/execution/broker.py`; it is NOT on main (verified 2026-09-30, zero
      occurrences on `origin/main`), which is why nothing changed here today.
      If and when it merges, a price amend is atomic and there is no instant
      at which the position is unprotected, the money cost of a replace is
      already established as zero, and the deterministic trail is evaluated
      once per session per position so the amend count is bounded at one per
      session whatever this floor is. At that point this gate has no
      surviving cost to defend and the honest floor becomes the venue
      minimum price increment -- one tick, SEC Rule 612 / Alpaca's published
      $0.01-at-or-above-$1 and $0.0001-below split, which
      `src/execution/broker_parts/stop_amend_pure.py::_quantize_price` and
      `src/execution/stop_records.py::_prices_match` already carry. That is
      a reading off the instrument rather than a picked percentage, and it
      is the same shape as item 183's removal of the picked
      `min_trade_weight_delta` churn floor. Do NOT make that change while
      806 is open; re-read this entry when it lands.
    open_question: >-
      CLOSED 2026-09-30 — both halves are now answered from the desk's own
      refusal record, with no new number and no owner input, exactly as this
      question proposed. (1) The premise was wrong: there are TWO gates on
      the deterministic path, not three. The ~2-4-session ratchet cooldown
      (`_trail_tightened_recently`) is reached only from the discretionary
      midday `TRAIL_STOP` branch in `src/pipeline.py` and never from
      `_apply_deterministic_trails`, so it has never refused a deterministic
      trail. (2) The two that ARE stacked are not redundant: all seven
      reconstructed refusals sat OUTSIDE the 1.25x-ATR noise band, so the
      noise band would have admitted every one of them and this gate is
      doing independent work. No value question remains; the number is
      ratified churn appetite and the ATR re-expression above failed on
      measurement.
    cost_while_unanswered: >-
      None outstanding. The refusal codes written to `specialist_evidence`
      (`kind='trail_state'`, `src/risk/trailing.py::TRAIL_CODE_TRAILED`) already
      name which gate refused each trail, which is what this entry wanted.
    wrong_as_of_2026_10_02: >-
      THIS NUMBER IS NOW WRONG BY ITS OWN RECORDED TEST, AND THE TEST WAS
      PRE-COMMITTED. The only cost this gate was kept for was measured and
      written down at src/risk/trailing.py@`A move must clear the existing stop by`: every stop replacement was
      a cancel-then-resubmit, so each admitted tighten opened a real window in
      which the position carried no protective order, and removing the gate
      would have added seven such windows across nine evaluation runs. The
      same comment named the exact condition that would end that defence --
      `_amend_resting_stop_price` reaching main -- and recorded "It is NOT on
      main (verified 2026-09-30)". IT IS ON MAIN. It is defined at
      src/execution/broker.py::AlpacaBroker._amend_resting_stop_price, constructed into the stop placer at
      src/execution/broker_parts/stop_place.py::StopPlacer.__init__ and :209, and
      `replace_stop_loss` now PREFERS it: src/execution/broker_parts/
      stop_place.py:1030-1062 amends the resting stop's price in place and
      falls back to cancel+resubmit only when the pre-amend position re-read
      fails or the order is not amendable, with the fallback's naked window
      timed and recorded (src/execution/broker_parts/stop_window.py::UnprotectedWindow.close). So on
      the preferred path there is no unprotected instant, and the measured
      cost that defended 2.0 is gone. By the derivation this entry already
      committed to, the honest floor is now ONE VENUE TICK -- SEC Rule 612
      (17 CFR 242.612), $0.01 at or above $1.00 and $0.0001 below, which
      `_quantize_price` and `_prices_match` already implement -- a reading off
      the instrument instead of a picked percentage.
      WHY THE VALUE IS NOT CHANGED IN THIS COMMIT, said plainly rather than
      deferred quietly: lowering this floor admits stop tightenings the desk
      currently refuses, and a tightened protective stop does not move back.
      That is a one-way change to live protection, so it is reported rather
      than taken by the agent that found it. The change itself is small and
      fully specified above: replace the percentage gate with a one-tick
      minimum read from `_quantize_price`.
