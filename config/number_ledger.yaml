      looked at.

      DERIVATION ATTEMPT 1 (2026-10-01, FAILED to settle): derive this cap
      from the per-run time and cost budget it serves. Failed -- that budget
      is itself unledgered; no row in this file names a per-run wall-clock or
      token budget, so the cap would hang off an unsourced number. DERIVATION
      ATTEMPT 2 (2026-10-01, FAILED to settle): derive it from the demand
      actually seen. Failed -- the scan computes whether the cap bound and
      whether the deadline cut it (`discovery_cap_reached`,
      `watched_drain_deadline_hit`) and the pipeline writes those booleans to
      a log line, but nothing persists the demand behind them; a boolean
      saying the cap bound cannot distinguish a true demand of 1000 from one
      of 2000. Stopped at two attempts: the recording below is what would
      settle it.
    open_question: >-
      How many externally-sourced candidates can the pipeline resolve per run
      within budget?
    cost_while_unanswered: >-
      A candidate is dropped unseen once the cap binds.
