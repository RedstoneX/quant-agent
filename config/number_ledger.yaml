    value: 12.0
    status: not-trade-governing
    site: src/risk/metrics.py
    note: >-
      Board item 107. One of the drift flag's two thresholds (weight percent
      of book). Consolidates three bare inline literals (src/pipeline.py's
      `_build_position_facts`, src/agents/portfolio_manager/__init__.py's
      `_fmt_position`, src/agents/position_reviewer.py's label string) that
      already existed on main before this change and were never a ledger
      site because a bare comparison literal inside a function body matches
      none of this scanner's five structural shapes. Naming the constant
      does not source it: it is still hand-chosen and unmeasured. `drift_flag`
      only sets a `⚠️DRIFT`/`positions_drift_flagged` decoration read by the
      Portfolio Manager and Position Reviewer prompts; no Python path sizes,
      prices, stops or exits a position from it, so it is informational, not
      trade-governing, exactly like the seats' other contextual read-outs
      (news, technicals). Not reclassified as `arbitrary`: that status is
      for a number a debt-tracked owner appetite call still has to settle,
      and this one decides nothing to settle.
