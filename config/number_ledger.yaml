    value: 25
    status: sourced
    site: src/risk/exit_guard.py
    source: >-
      Wilder's own ADX threshold for a strong trend, as published in J. Welles
      Wilder, New Concepts in Technical Trading Systems (1978), the standard
      convention (ADX above 25 = trend strong enough to trade with). Definition
      and use: src/risk/exit_guard.py@`# A support/resistance break is confirmed by a d`.
    note: >-
      Trade-governing: at or above this ADX a with-trend structural break enters
      the patient strong-with-trend regime (two confirmed closes AND the prior
      swing-low must also break) under the owner mandate 2026-09-24 trend-scaled
      exit; below it, the default two-close floor. The only ADX threshold used —
      Wilder's published value, not a discretionary pick.
