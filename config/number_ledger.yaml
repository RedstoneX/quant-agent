  - id: src.config.NominationConfig.max_per_seat_per_run
    value: 3
    status: arbitrary
    site: src/config.py
    note: >-
      Nomination caps: 3 per seat, 6 per run, 3 external. Recorded in the
      2026-09-14 verification as affordability caps, not measurements. They
      bound what the desk can ever consider, so a name outside them is never
      looked at.
    open_question: >-
      How many nominations per seat per run does the downstream pipeline
      actually resolve within its cost and deadline budget?
    cost_while_unanswered: >-
      A seat's best idea can be crowded out by its own earlier ones, ranked
      only by arrival.
  - id: src.config.NominationConfig.max_total_per_run
    value: 6
    status: arbitrary
    site: src/config.py
    note: >-
