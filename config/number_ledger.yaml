  - id: src.universe_screen.HISTORY_FETCH_DAYS
    value: 400
    status: not-trade-governing
    site: src/universe_screen.py
    note: >-
      Calendar days of daily bars requested per symbol. A fetch window, not
      a threshold: the one-year history test is a calendar comparison
      between the first and last bar, and this only has to reach past a
      year. It never decides a verdict unless set BELOW a year, which would
      fail every symbol's history test visibly.
