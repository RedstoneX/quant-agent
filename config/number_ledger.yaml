      https://www.rfc-editor.org/rfc/rfc9110.html#name-402-payment-required
      It is a PROTOCOL CONSTANT fixed by that specification and by the model
      provider's use of it for an exhausted credit balance -- the desk does
      not choose it and cannot change it, exactly as it does not choose a
      broker tick size. It is read only at src/agents/base.py::BaseAgent._execute and :2530,
