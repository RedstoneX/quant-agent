  - id: src.infra_retry_policy.MAX_RETRIES
    value: 2
    status: not-trade-governing
    site: src/infra_retry_policy.py
    note: "Bounded retries of a transient infrastructure fault (an LLM provider blip, a failed owner-alert send) before the harder failure path runs. It is the same number as `MacroConfig.max_retries` in src/config/macro.py, which the macro provider's retry loop (`MacroDataProvider`) spends, and `LLMCostCircuitConfig` in src/config/llm_cost.py says it mirrors that policy. It bounds how many times a failed call is repeated, never a price, size, stop or whether a trade is allowed; a wrong value delays a retry by seconds or fails one call sooner. If the macro default is ever re-derived this row must be revisited, since the two are meant to stay equal."
