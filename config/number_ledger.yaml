  - id: src.execution.stop_records._ALPACA_TICK_AT_OR_ABOVE_DOLLAR
    value: 0.01
    status: instrument
    site: src/execution/stop_records.py
    source: >-
      SEC Rule 612, the sub-penny rule: the minimum pricing increment for an
      NMS stock priced at or above $1.00 is $0.01.
      https://www.sec.gov/divisions/marketreg/subpenny612faq.htm (fetched and
      confirmed 2026-09-18). A stop priced off this grid is rejected, so the
      value is read off the venue rule, not chosen. Definition site:
      src/execution/stop_records.py. PRE-EXISTING FINDING, recorded not fixed:
      Rule 612 was amended in September 2024 to add a $0.005 increment for
      stocks at or above $1.00 whose time-weighted average quoted spread is
      $0.015 or less, with the primary listing exchange assigning each stock
      its tick from 2025-11-03 (SEC press release 2024-137,
      https://www.sec.gov/newsroom/press-releases/2024-137 ). This constant
      predates that and does not model the half-penny tier, so the source is
      current for the rule as it stood and stale for the rule as it stands.
      Owner call, not an agent's.
