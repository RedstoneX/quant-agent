      as "the identity, not a setting". It is not an identity.
      src/config.py:842 says section 12.1's safety argument rests on the same
      1xATR figure in config/prompts/tech_analyst.md - a PROMPT, which
      Invariant 2 says cannot be the final authority.
    open_question: >-
      What stop distance, in ATRs, is so tight that a level-backed stop is a
      guaranteed whipsaw regardless of the structure behind it?
    cost_while_unanswered: >-
      The last line of defence under every tight stop is a round number
      mirrored from prompt prose.
