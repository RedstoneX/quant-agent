# Live-capital pre-flight attestations (board item 150).
#
# The live-capital pre-flight gate (src/live_capital_preflight.py, run via
# scripts/live_capital_preflight.py) checks each named condition that must hold
# before real money is switched on. Conditions that a machine cannot verify are
# human judgments — they are listed here and BLOCK go-live until a named person
# has genuinely verified them and recorded that here.
#
# Every entry ships attested: false. That is deliberate: nothing about this desk
# is live-ready today, so the gate BLOCKS by default. Setting attested: true
# without having done the work defeats the entire point of item 150.
#
# To attest a condition, set:
#   attested:    true
#   attested_by: "<your name>"
#   attested_on: "YYYY-MM-DD"
#   note:        "<what was verified / where the evidence lives>"
#
# An entry is only counted as PASS when attested is exactly true AND attested_by
# and attested_on are both filled in. The condition ids MUST match
# MANUAL_CONDITIONS in src/live_capital_preflight.py.

