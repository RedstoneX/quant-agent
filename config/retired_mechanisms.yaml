# Mechanisms this desk USED to have, and the words that described them.
#
# WHY THIS FILE EXISTS. On 2026-09-14 the daily-loss breaker stopped
# liquidating the book and started halting instead (docs/WORK.md item 32).
# `_midday_emergency_liquidate` and `_check_late_breach_and_emergency_
# liquidate` were deleted. Three days later four places were still describing
# the deleted behaviour, and two of them were text the desk PAID a model to
# read: the position reviewer's assembled prompt told the seat, every time
# any safety net had fired, that the desk performs an "emergency sell-all on
# −3% daily-loss breach". Both the mechanism and the number were gone.
#
# Deleting code does not delete the prose about it, and prose is not compiled.
# This file is the compiler. Retiring a mechanism means adding it here, and
# then the build fails until every description of it is gone too.
#
# ADD AN ENTRY WHENEVER YOU DELETE OR RENAME A MECHANISM A MODEL IS TOLD
# ABOUT. That is the only maintenance this check asks for, and it is asked
# at exactly the moment the person has the facts: the deletion commit.
#
# Fields:
#   retired      YYYY-MM-DD, from git, not from memory.
#   why          one plain line: what replaced it.
#   symbols      code identifiers that no longer exist. Also checked against
#                the source itself, so a resurrected name fails too.
#   phrases      prose forms of the same claim, lowercased, matched as
#                substrings. THIS is the field that catches prompt text,
#                because prompts never name the function.
#   allowed_in   whole files where a mention is legitimate: this registry,
#                the incident history, the check's own tests. A TOMBSTONE in
#                live code does NOT get a whole file — it puts the marker
#                `retired-ok` on the line. Per line, because allowing a whole
#                file is how `src/pipeline.py` would have gone on hiding the
#                `run_intra_check` docstring, one of the four sites this
#                check exists to find.
#
# Scope note, stated rather than implied: `phrases` is a substring match over
# prompt files, agent-assembled strings, docstrings and comments. Keep each
# phrase specific enough that it cannot appear innocently. A phrase like
# "sell" would be useless; "emergency sell-all" cannot be about anything else.

retired:

  - name: daily-loss whole-book liquidation
    retired: 2026-09-14
    why: >-
      Replaced by `_halt_on_daily_loss_breach`, which refuses new risk,
      verifies every held position's stop AT THE BROKER, files a durable
      per-symbol reason and alerts the owner. It closes, resizes and zeroes
      nothing. The old path submitted LIMIT orders 1% through the market and
      then restored the original stops on any leg that did not fill, so on a
      correlated gap it cancelled every protective stop, sold nothing, and
      put the stops back. It never once fired in production.
    symbols:
      - _midday_emergency_liquidate
      - _check_late_breach_and_emergency_liquidate
    phrases:
      - "emergency sell-all"
      - "emergency-sell every position"
      - "emergency sell every position"
      - "sell-all when daily loss"
      - "liquidates every position"
      - "force-liquidates"
    allowed_in:
      - config/retired_mechanisms.yaml
      - src/retired_mechanisms.py
      - docs/INCIDENT_HISTORY.md
      - docs/WORK.md
      - docs/BOARD_NOTES.md
      - tests/test_retired_mechanisms.py

  - name: the flat -3% daily-loss threshold
    retired: 2026-09-11
    why: >-
      SUPERSEDED 2026-09-20 — there is no daily-loss threshold of any kind
      any more: the whole account-level breaker was removed on the owner's
      instruction (see the 2026-09-20 entry below). This entry stays because
      the phrases below must never come back. At the time it was written the
      breaker had one limit with three rungs and none of them was a flat
      -3%; today the honest answer to "what is the daily-loss threshold" is
      that the desk does not have one.
    symbols: []
    phrases:
      - "-3% daily-loss"
      - "−3% daily-loss"
      - "-3% daily loss"
      - "−3% daily loss"
      - "daily loss breached -3%"
      - "3% daily-loss breach"
    allowed_in:
      - config/retired_mechanisms.yaml
      - src/retired_mechanisms.py
      - docs/INCIDENT_HISTORY.md
      - docs/WORK.md
      - docs/BOARD_NOTES.md
      - tests/test_retired_mechanisms.py

  - name: correlation breach as an exit trigger
    retired: 2026-09-13
    why: >-
      Removed from `_HARD_TRIGGER_KEYWORDS` and
      `EXTERNAL_INFORMATION_PATTERNS` (docs/WORK.md item 44). Nothing in the
      desk computes a correlation-breach EVENT, so the claim was never
      checkable, and a correlation is a function of the price series, so it
      was never external information either. The position reviewer's prompt
      still names it — to tell the seat it does NOT match — which is why that
      file is allowed below.
    symbols: []
    phrases:
      - "correlation breach is a valid trigger"
      - "correlation cluster breach is a valid trigger"
    allowed_in:
      - config/retired_mechanisms.yaml
      - src/retired_mechanisms.py
      - docs/INCIDENT_HISTORY.md
      - docs/WORK.md
      - docs/BOARD_NOTES.md
      - tests/test_retired_mechanisms.py

  - name: the account-level loss-alarm halt and the rolling-return BUY brake
    retired: 2026-09-20
    why: >-
      Removed ENTIRELY on the owner's direct instruction, not as a defect
      fix. His words: "I'm starting to think that I'm fine with the stops on
      the individual stocks and I do not want a nuclear option so remove the
      whole secondary halt on portfolio completely because there's too many
      things you keep finding where a slight normal fluctuation in the market
      can liquidate or halt everything — that's too dangerous to leave — the
      proper stop losses should be enough." Gone: the daily circuit breaker
      that halted new trading on the day's loss, the 5-day / 20-day
      rolling-return brakes that halved every new BUY and SHORT, the
      volatility yardstick built to set their thresholds, and every gate,
      status, banner and alert that existed to serve them. What REMAINS is
      the §11.2 peak-to-trough gross-exposure de-levering ladder
      (`GROSS_LADDER`), which is a different mechanism the owner did not ask
      to remove: it trims exposure gradually and never halts the desk.
      Per-position stops are the desk's loss protection.
    symbols:
      - check_daily_loss
      - daily_loss_numerator
      - daily_loss_limit_pct
      - daily_loss_limit_basis
      - apply_drawdown_scale
      - DRAWDOWN_BUY_SCALE
      - vol_relative_drawdown_threshold_pct
      - measure_portfolio_daily_vol
      - _halt_on_daily_loss_breach
      - _daily_loss_breach
      - _alert_owner_daily_loss_halt
      - _check_late_breach_and_halt
      - drawdown_5d_threshold_pct
      - drawdown_20d_threshold_pct
      - drawdown_buy_cap
      - drawdown_buy_halved
      - effective_max_daily_loss_pct
      - daily_loss_halted
      - daily_loss_recheck
      - in_drawdown
      - held_book_daily_vol_pct
      - held_book_daily_pnl
      - normalized_holding_weights
      - portfolio_daily_vol_pct
      - unprotected_at_halt
      - REALIZED_VOL_WINDOW_SESSIONS
      - MIN_REALIZED_VOL_RETURNS
      - REALIZED_VOL_SKIP_NEWEST_SESSIONS
      - DEFAULT_DRAWDOWN_VOL_SENSITIVITY
    # The five deleted settings.yaml KEYS — `max_daily_loss_pct`,
    # `daily_loss_risk_multiple`, `drawdown_vol_sensitivity`,
    # `drawdown_5d_risk_multiple`, `drawdown_20d_risk_multiple` — are
    # deliberately NOT listed above. `RiskConfig._reject_deleted_loss_alarm_
    # keys` has to name them to refuse them, and it refuses them at config
    # load with a loud error, which is a stronger guarantee than this
    # scanner gives. Listing them here would only flag that validator.
    phrases:
      - "daily-loss circuit breaker"
      - "daily loss circuit breaker"
      - "daily-loss breaker"
      - "halves every new buy"
      - "halved every buy"
      - "in_drawdown=true — the risk engine"
      - "no new risk this session"
    allowed_in:
      - config/retired_mechanisms.yaml
      - src/retired_mechanisms.py
      - docs/INCIDENT_HISTORY.md
      - docs/WORK.md
      - docs/BOARD_NOTES.md
      - tests/test_retired_mechanisms.py

  - name: the automatic 25% oversized base-allocation cut
    retired: 2026-09-26
    why: >-
      IT NEVER EXISTED IN CODE. Two live sheets described it as machinery:
      `config/prompts/portfolio_manager.md` told PM "Cut every BUY base 25%"
      on 2+ `oversized` tags, and `config/prompts/risk_manager.md` told the
      Risk Manager that PM "pre-adjusts its sizing before you ever see the
      plan — 2+ `oversized` tags cut its base allocations 25%", and used that
      as grounds to discount a conservative-looking plan as anchoring rather
      than conviction. What is real: `_build_rm_recent_verdicts`
      (`src/pipeline.py`) renders the last 5 verdicts with their `cat=` tags
      into PM's sheet, and PM's sheet asks the model to adjust. Nothing reads
      `reason_category` and resizes anything; the 25% was an invented figure
      (`docs/WORK.md` item 99(f), measured 2026-09-19 — 36 of 37 recorded
      `risk_allocation_pct` sat on the prompt's own 0.25 grid with a maximum
      of 3.0, no trace of a 25% haircut). The number is removed rather than
      replaced: choosing a different one would be the same defect. A seat may
      be shown another seat's history; it may not be told that history has
      already been acted on when it has not.
    symbols: []
    phrases:
      - "cut every buy base 25%"
      - "base allocations 25%"
      - "pre-adjusts its sizing before you ever see the plan"
    allowed_in:
      - config/retired_mechanisms.yaml
      - src/retired_mechanisms.py
      - docs/INCIDENT_HISTORY.md
      - docs/WORK.md
      - docs/BOARD_NOTES.md
      - tests/test_retired_mechanisms.py

  - name: the prompt-only sizing and conviction arithmetic (PM + Technical)
    retired: 2026-09-26
    why: >-
      NONE OF IT WAS EVER CODE. Board item 107(b): the portfolio manager's
      sheet carried a whole arithmetic of sizing that no Python evaluated --
      a conviction-to-base lookup (high=3.0 / moderate=1.75 / low=0.75, the
      mids of hand-typed 2.0-4.0 / 1.0-2.5 / 0.5-1.0 bands), a reward:risk
      bonus (x1.25 at R/R >= 3.0, restated elsewhere as "add 20-30%"), a
      x0.5 halving for a Tech `high` at `signal_age_days >= 8`, a permitted
      +/-0.5pp shade inside the band, and a per-net-source ceiling schedule
      (net one 3.0%, net two 4.0%, net three 5.0%) attributed to the
      CONSTRUCTOR although `agreement_ceiling_pct` was retired 2026-09-14
      and its settings key is refused at load. The technical sheet carried
      the matching set: `conviction: high` gated on a counted "3+ aligned
      signals", three fixed age brackets (1-3 / 4-7 / 8+ days), forward-PE
      40x/60x and P/S 15/25 "stretched"/"nosebleed" tiers, and a worked
      example claiming a computed ratio "passes the >= 2.0 discipline"
      three sections after the same sheet says those floors were invented
      and eliminated. Every figure was hand-typed, none appears in
      `config/number_ledger.yaml`, none is computed anywhere in `src/`, and
      each of them sized or ranked real trades through the model that read
      them. They are DELETED, not re-chosen: picking a different figure
      would be the same defect. What replaced them is an instruction --
      name the agreeing signals and the falsifier, judge staleness against
      the `expected_horizon_sessions` the seat itself emits, disclose a
      valuation multiple rather than adjusting on it, and justify the risk
      figure in `sizing_logic` between the ledgered
      `min_position_risk_pct` floor and `max_position_risk_pct` cap.
    symbols:
      - conviction_to_base
      - rr_bonus
      - rr_mult
    phrases:
      - "3+ aligned signals"
      - "mid of 2.0-4.0"
      - "mid of 1.0-2.5"
      - "mid of 0.5-1.0"
      - "0.25 if r/r"
      - "add 20-30% to the base"
      - "signal_age_days ≥ 8"
      - "signal_age_days >= 8"
      - "±0.5pp inside the range"
      - "+/-0.5pp inside the range"
      - "same rating, age 1-3 days"
      - "same rating, age 4-7 days"
      - "age 8+ days without progress"
      - "forward pe > 40x"
      - "forward pe > 60x"
      - "p/s > 15"
      - "p/s > 25"
      - "r/r ≥ 3.0"
      - "r/r >= 3.0"
      - "net two at 4.0%"
      - "≥ 2.0 discipline"
      - ">= 2.0 discipline"
    allowed_in:
      - config/retired_mechanisms.yaml
      - src/retired_mechanisms.py
      - docs/INCIDENT_HISTORY.md
      - docs/WORK.md
      - docs/BOARD_NOTES.md
      - tests/test_retired_mechanisms.py
